sections:
  - id: preamble
    level: 2
    bodyZh: |+
      ![欢迎页面](./assets/mercedes-amg-f1-w12-e-performance/welcome-hero.png)

      #### 亲爱的 iRacing 用户：

      恭喜您购买 Mercedes-AMG F1 W12 E Performance！iRacing 全体成员感谢您的支持以及对我们产品的认可。我们致力于提供极致的模拟赛车体验，也希望您驾驶新车时能在赛道上尽享激情！

      Mercedes-AMG Petronas Formula One Team 在过去十年的大部分时间里都是世界上最具统治力的车队。在 Lewis Hamilton、Nico Rosberg、Valtteri Bottas 和 George Russell 的共同努力下，车队于 2014 至 2020 年连续七次赢得世界车手冠军和世界车队冠军。2021 赛季是竞赛规则大幅改革前的最后一个赛季，车队推出 F1 W12 E Performance，作为王座的新一代继承者。这款赛车搭载可输出超过 1,000 马力的 1.6 升 V6 混合动力系统，是统治级 W11 的进化版本；W11 在前一年仅有四场比赛未能取胜。W12 在巴林首秀便由 Hamilton 驾驶夺冠，并在前四场比赛中赢下三场；随后又帮助 Hamilton 在一场末段降雨、精彩纷呈的俄罗斯大奖赛中取得职业生涯第 100 场大奖赛胜利。

      本指南将说明如何充分发挥新车的性能，涵盖从赛道外的车辆设置调整，到驾驶时在座舱内看到的各种信息。希望本指南能帮助您快速上手。

      再次感谢您的购买，我们赛道上见！

      ![Mercedes-AMG F1 W12 E Performance 赛车](./assets/mercedes-amg-f1-w12-e-performance/welcome-car.png)

    bodyEn: |+
      ![Image](./assets/mercedes-amg-f1-w12-e-performance/welcome-hero.png)

      #### DEAR IRACING USER,

      Congratulations on your purchase of the Mercedes-AMG F1 W12 E Performance! From all of us at iRacing, we appreciate your support and your commitment to our product. We aim to deliver the ultimate sim racing experience, and we hope that you’ll find plenty of excitement with us behind the wheel of your new car!

      The Mercedes-AMG Petronas Formula One Team has been the most dominant race team in the world over much of the past decade, winning seven World Driver’s and World Constructor’s Championships in a row from 2014-2020 thanks to the combined efforts of Lewis Hamilton, Nico Rosberg, Valtteri Bottas, and George Russell. For the 2021 season, the last before sweeping revisions to the competition formula, the team introduced the F1 W12 E Performance as its next heir to the throne. Powered by a 1.6-liter V6 hybrid capable of producing over 1,000 horsepower, the car was an evolution of the dominant W11 that had won all but four races the previous year. The W12 won with Hamilton on its debut in Bahrain and took victories in three of its first four starts, while also leading Hamilton to his milestone 100th career Grand Prix victory in a compelling Russian Grand Prix that saw rain fall in the race’s closing laps.

      The following guide explains how to get the most out of your new car, from how to adjust its settings off of the track to what you’ll see inside of the cockpit while driving. We hope that you’ll find it useful in getting up to speed.

      Thanks again for your purchase, and we’ll see you on the track!

      ![Image](./assets/mercedes-amg-f1-w12-e-performance/welcome-car.png)

