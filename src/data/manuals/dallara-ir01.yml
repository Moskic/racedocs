      #### 转向小齿轮传动比

      可以更改转向小齿轮尺寸，以改变车手感受到的转向快慢。该数值表示转向小齿轮每转一圈时齿条的移动量；数值越大，转向感受越快。

    bodyEn: |+
      ![Image](./assets/dallara-ir01/steering-system.png)

      #### STEERING PINION RATIO

      The size of the steering pinion can be changed to alter how fast or slow the steering feels to the driver. The value represents the amount of steering rack movement for a single revolution of the steering pinion, with larger values resulting in a faster steering feel.

