sections:
  - id: preamble
    level: 2
    bodyZh: |+
      ![欢迎页面](./assets/dallara-ir01/welcome-hero.png)

      #### 亲爱的 iRacing 用户：

      恭喜您购买 Dallara iR-01！iRacing 全体成员感谢您的支持以及对我们产品的认可。我们致力于提供极致的模拟赛车体验，也希望您驾驶新车时能在赛道上尽享激情！

      Dallara iR-01 是 iRacing 与 Dallara 针对国际顶级开轮式赛车挑战给出的答案。这台迅捷灵敏的赛车融合了大奖赛赛车运动过去、现在与未来的精华，容易上手，但有限的电子系统与驾驶辅助也让真正掌握它充满挑战。

      iR-01 搭载自然吸气 3.0 升 V10 发动机，令人联想起 20 世纪 90 年代初期和中期称霸赛场的动力单元。这台发动机可输出超过 900 马力，而车辆干重仅为 600 千克，由此造就了一台在车流中也极具竞争力、驾驶起来令人血脉偾张的激进赛车。

      本指南将说明如何充分发挥新车的性能，涵盖从赛道外的车辆设置调整，到驾驶时在座舱内看到的各种信息。希望本指南能帮助您快速上手。

      再次感谢您的购买，我们赛道上见！

      ![Dallara iR-01 赛车](./assets/dallara-ir01/welcome-car.png)

    bodyEn: |+
      ![Image](./assets/dallara-ir01/welcome-hero.png)

      #### DEAR iRACING USER,

      Congratulations on your purchase of the Dallara IR-01! From all of us at iRacing, we appreciate your support and your commitment to our product. We aim to deliver the ultimate sim racing experience, and we hope that you’ll find plenty of excitement with us behind the wheel of your new car!

      The Dallara IR-01 is iRacing and Dallara’s answer to the challenges of premier international open-wheel motorsport. Designed to blend together the best elements of grand prix racing’s past, present, and future, this fast and agile machine is easy to pick up, but limited electronics and driver aids make it challenging to master.

      The IR-01 is powered by a naturally aspirated, 3.0-liter V10 reminiscent of the engines that dominated the sport in the early and mid 1990s. Producing upwards of 900 horsepower at a dry weight of just 600 kilograms, the result is an aggressive car that races well in traffic and is a pure thrill ride to drive.

      The following guide explains how to get the most out of your new car, from how to adjust its settings off of the track to what you’ll see inside of the cockpit while driving. We hope that you’ll find it useful in getting up to speed.

      Thanks again for your purchase, and we’ll see you on the track!

      ![Image](./assets/dallara-ir01/welcome-car.png)

