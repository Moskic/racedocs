sections:
  - id: preamble
    level: 2
    bodyZh: |+
      ![欢迎页面](./assets/super-formula-sf23/welcome-hero.png)

      #### 亲爱的 iRacing 用户：

      恭喜您购买 Super Formula SF23！iRacing 全体成员感谢您的支持以及对我们产品的认可。我们致力于提供极致的模拟赛车体验，也希望您驾驶新车时能在赛道上尽享激情！

      Dallara SF23 于 2023 年 Super Formula 赛季首次亮相，是这家意大利制造商为日本顶级方程式赛车系列开发的第三款开放轮式赛车。从外观上看，SF23 在前代车型的基础上引入了全新的空气动力学设计，旨在创造更多超车机会。在可持续发展方面，新设计采用新型天然材料，使原材料和制造环节的二氧化碳排放量减少 75%；车辆使用的 Yokohama 轮胎也显著增加了可再生原材料的比例，同时保持了上一代轮胎的性能。

      再次感谢您的购买，我们赛道上见！

      ![Super Formula SF23 赛车](./assets/super-formula-sf23/welcome-car.png)

    bodyEn: |+
      ![Image](./assets/super-formula-sf23/welcome-hero.png)

      #### DEAR iRACING USER,

      Congratulations on your purchase of the Super Formula SF23! From all of us at iRacing, we appreciate your support and your commitment to our product. We aim to deliver the ultimate sim racing experience, and we hope that you’ll find plenty of excitement with us behind the wheel of your new car!

      Debuting in the 2023 Super Formula season, the Dallara SF23 is the third open-wheel car developed by the Italian manufacturer for Japan’s premier open-wheel racing series. From a visual standpoint, the SF23 evolves from its predecessor by introducing new aerodynamics designed to produce more overtaking. From a sustainability one, the new design reduces carbon dioxide emissions in raw materials and manufacturing by 75% thanks to new, natural materials, while even the Yokohama tires used on the car use significantly more renewable raw materials while maintaining the performance of previous tires.

      Thanks again for your purchase, and we’ll see you on the track!

      ![Image](./assets/super-formula-sf23/welcome-car.png)

