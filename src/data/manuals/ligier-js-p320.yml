  - id: introduction
    level: 2
    titleZh: 简介
    titleEn: INTRODUCTION
    bodyZh: |+
      本指南旨在帮助您深入理解车库中可用的底盘设置选项，以便按照个人偏好调校车辆。
      
      不过，在深入调整底盘之前，最好先熟悉赛车和赛道。为此，我们为这些赛车经常使用的各条赛道提供了基准设定。
      
      要加载基准设定，只需打开“Garage（车库）”，点击“iRacing Setups”，再选择适合目标赛道的设定。如果当前赛道没有专用基准设定，可以选择特性相近赛道的设定作为起点。
      
      选择合适的设置后，请驶上赛道并专注于跑出平顺且稳定的圈次，找准正确的赛车线，同时在连续多圈中观察轮胎磨损和操控趋势。
      
      当您确信使用随车提供的基准设置已接近自身驾驶极限后，请继续阅读，开始按照个人操控偏好调校车辆。

    bodyEn: |+
      The information found in this guide is intended to provide a deeper understanding of the chassis setup adjustments available in the garage, so that you may use the garage to tune the chassis setup to your preference.
      
      Before diving into chassis adjustments, though, it is best to become familiar with the car and track. To that end, we have provided baseline setups for each track commonly raced by these cars.
      
      To access the baseline setups, simply open the Garage, click iRacing Setups, and select the appropriate setup for your track of choice. If you are driving a track for which a dedicated baseline setup is not included, you may select a setup for a similar track to use as your baseline.
      
      After you have selected an appropriate setup, get on track and focus on making smooth and consistent laps, identifying the proper racing line and experiencing tire wear and handling trends over a number of laps.
      
      Once you are confident that you are nearing your driving potential with the included baseline setups, read on to begin tuning the car to your handling preferences.

  - id: getting-started
    level: 3
    titleZh: 快速上手
    titleEn: GETTING STARTED
    bodyZh: |+
      ![图示](./assets/ligier-js-p320/getting-started.png)
      
      启动车辆前，建议先为制动力分配和牵引力控制设置映射控制按键。虽然并非必需，但这样可以在赛道上根据个人驾驶风格和赛道条件，快速调整制动力分配与牵引力控制系统。
      
      进入车辆后，踩下离合器并拉动“升挡”拨片挂入挡位，然后在松开离合器的同时踩下油门踏板即可起步。Ligier JS P320 升挡和降挡均无须手动操作离合器。
      
      建议在仪表台上的换挡提示灯全部亮起时升挡，对应转速约为 6600 RPM。

    bodyEn: |+
      ![Image](./assets/ligier-js-p320/getting-started.png)
      
      Before starting the car, it is recommended to map controls for Brake Bias and Traction Control settings. While this is not mandatory, this will allow you to make quick changes to the brake bias and traction control systems to suit your driving style and track conditions while out on track.
      
      Once you load into the car, getting started is as easy as pressing the clutch and pulling the “upshift” paddle to put it into gear, and hitting the accelerator pedal while releasing the clutch. The Ligier JS P320 does not require manual clutch operation to shift in either direction.
      
      Upshifting is recommended when the shift lights on the dashboard are all fully illuminated, around 6600rpm.

  - id: loading-an-iracing-setup
    level: 3
    titleZh: 载入 iRacing 设置
    titleEn: LOADING AN iRACING SETUP
    bodyZh: |+
      ![图示](./assets/ligier-js-p320/loading-iracing-setup.png)
      
      进入会话时，车辆会自动载入 iRacing 基准设置 [baseline.sto]。如果您希望使用 iRacing 针对各种条件预制的其他设置，可依次单击“车库 &gt; iRacing 设置 &gt;”，再选择符合需求的设置。
      
      若要自定义车辆设定，只需在车库中完成所需调整，然后点击“Apply（应用）”。
      
      若要保存设定供日后使用，请点击右侧的“Save As（另存为）”，为设定命名并保存更改。点击车库右侧的“My Setups（我的设定）”即可查看全部个人设定。
      
      如需与另一位车手或会话中的所有人共享设置，可以单击车库右侧的“共享”。
      
      如果其他车手正在与您共享设置，也可以在车库右侧的“共享设置”中找到该设置。

    bodyEn: |+
      ![Image](./assets/ligier-js-p320/loading-iracing-setup.png)
      
      Upon loading into a session, the car will automatically load the iRacing Baseline setup [baseline.sto]. If you would prefer one of iRacing’s pre-built setups that suit various conditions, you may load it by clicking Garage &gt; iRacing Setups &gt; and then selecting the setup to suit your needs.
      
      If you would like to customize the setup, simply make the changes in the garage that you would like to update and click apply.
      
      If you would like to save your setup for future use click “Save As” on the right to name and save the changes. To access all of your personally saved setups, click “My Setups” on the right side of the garage.
      
      If you would like to share a setup with another driver or everyone in a session, you can select “Share” on the right side of the garage to do so.
      
      If a driver is trying to share a setup with you, you will find it under “Shared Setups” on the right side of the garage as well.

  - id: dash-configuration
    level: 2
    titleZh: 仪表配置
    titleEn: DASH CONFIGURATION
    bodyZh: |+
      方向盘集成的数字显示屏以清晰易读的单页布局向车手显示所有相关信息。
      
      ![图示](./assets/ligier-js-p320/dashboard-configuration.png)
      
      | 仪表页面布局 | 数值 |
      | --- | --- |
      | 上一圈 | 上一圈圈速以蓝色显示在屏幕左上方 |
      | Best | 本赛段最佳圈速以粉色显示在屏幕右上方 |
      | Gear Indicator | 当前挡位显示在屏幕中央 |
      | RPM | 发动机转速显示在挡位指示器正下方 |
      | 胎压 | 实时胎压显示在屏幕中央，单位取决于车库设置：英制显示 psi，公制显示 bar。 |
      | Fuel Used | 显示屏左侧显示离开维修区后消耗的燃油量；英制单位显示美制加仑，公制单位显示升。 |
      | Fuel Lap | 每圈结束后，上一圈耗油量会显示在 Fuel Used 数值下方，单位为美制加仑或升 |
      | DIFF | 实时分段时间显示在屏幕右侧、最佳圈速下方，用于比较当前圈与最佳圈；更快时显示绿色，更慢时显示红色 |
      | Speed | 车速显示在屏幕右侧，英制单位为 mph，公制单位为 km/h |
      | 机油压力 | 发动机机油系统压力显示在左下方，英制单位为 psi，公制单位为 bar |
      | TC | 当前牵引力控制设置显示在屏幕底部的黄色方框内。该值与 F8 黑框中的 TC 选项一致；设置为“0”时显示“OFF”，表示系统已禁用。 |
      | 油门曲线 | 当前油门曲线设置显示在屏幕右下方的紫色方框内 |
      | Water T | 发动机冷却水温显示在屏幕右下方，英制单位为 °F，公制单位为 °C |

    bodyEn: |+
      The steering wheel’s integrated digital display shows all relevant information to the driver in an easy to read, single-page format.
      
      ![Image](./assets/ligier-js-p320/dashboard-configuration.png)
      
      | Dash Page Layout | Value |
      | --- | --- |
      | Last | The previously completed lap time is shown in the upper left of the display in blue |
      | Best | The session’s best lap is shown in the upper right of the display in pink |
      | Gear Indicator | The currently-selected gear is located in the middle of the display |
      | RPM | Engine RPM is located just beneath the gear indicator |
      | Tyre Press | Live pressures are shown in the center of the display in units based on what is selected in the garage. Imperial units will display Pounds-per-square-Inch and Metric units will display Bar. |
      | Fuel Used | How much fuel that has been used since leaving pit road is shown on the left side of the display. Imperial units will show US Gallons and Metric units will show Liters |
      | Fuel Lap | After completing each lap the amount of fuel that was used in the previous lap will be displayed beneath the Fuel Used value in US Gallons or Liters |
      | DIFF | A live split time is shown on the right side of the display underneath the Best Lap display. This will compare the current lap against the Best lap, displaying a faster lap in green and a slower lap in red |
      | Speed | The vehicle’s speed is shown on the right side of the display in Miles-per-Hour for Imperial units and Kilometers-per-Hour for Metric units |
      | OIL P | The engine oil system pressure is shown on the bottom left in Pounds-per-square-inch for Imperial units and Bar for Metric units |
      | TC | The currently-selected Traction Control setting is shown in a yellow box on the bottom of the display. This value will match the TC option in the F8 black box unless the setting is “0”, when this will display “OFF” to indicate the system is disabled |
      | PPS | The currently-selected throttle shape setting is shown on the bottom right of the display in a purple box |
      | Water T | The engine’s cooling water temperature is displayed in the bottom right, in °F for Imperial and °C for Metric units |

  - id: racelogic
    level: 3
    titleZh: Racelogic
    titleEn: RACELOGIC
    bodyZh: |+
      ![图示](./assets/ligier-js-p320/racelogic.png)
      
      车手左侧仪表台顶部安装有 Racelogic 分段与圈速显示器。行驶过程中，它会显示当前圈相对本赛段最佳圈速的分段时间，并以图形条表示时间差。正时间差且图形条位于中心右侧表示当前圈慢于基准；负时间差且图形条位于中心左侧表示当前圈更快。完成一圈后，显示器会显示刚完成的圈速以及新一圈的时间差。

    bodyEn: |+
      ![Image](./assets/ligier-js-p320/racelogic.png)
      
      To the left of the driver, mounted on top of the dash, is a Racelogic Split and Laptime display. During a lap this display will show the current split time relative to the session best lap time, as well as a graphical bar representing the displayed time difference. A positive split and a bar displayed to the right of center will indicate a lap slower than the reference, while a negative split and a bar to the left of center indicates a faster lap. When a lap is completed, the display will show the previously completed lap time as well as a split for the new lap.

