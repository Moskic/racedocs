sections:
  - id: preamble
    level: 2
    bodyZh: |+
      ![图示](./assets/ligier-js-p320/welcome-hero.png)
      
      #### 亲爱的 iRacing 用户：
      
      Ligier JS P320 是 Ligier 面向全球 LMP3 规则推出的最新设计，于 2019 年夏季发布。它接替了自 2015 年起征战、在全球及国际赛事中赢得数百场胜利和多个冠军的 JS P3。为适应新一代 LMP3 规则，JS P320 在车身和悬架方面进行了重大改进，并加入牵引力控制以及动力更强的新款 Nissan V8 发动机。
      
      在进入顶级 IMSA WeatherTech 跑车锦标赛的前两个赛季中，Ligier 赛车统治了 LMP3 组别。2021 年，在车手冠军 Gar Robinson 的带领下，Riley Motorsports 在积分榜上取得第一和第三；CORE Autosport 的 Colin Braun 与 Jon Bennett 组合在首个赛季获得第二，并于 2022 年夺冠。自 2024 年起，JS P320 与其他 LMP3 赛车将仅参加 IMSA VP Racing SportsCar Challenge，并在与 GT4 赛车共同进行的多组别比赛中作为更快的组别参赛。
      
      再次感谢您的购买，我们赛道上见！
      
      ![图示](./assets/ligier-js-p320/welcome-car.png)

    bodyEn: |+
      ![Image](./assets/ligier-js-p320/welcome-hero.png)
      
      #### DEAR iRACING USER,
      
      Ligier’s latest design to compete under global LMP3 regulations, the Ligier JS P320 launched in the summer of 2019. The JS P320 succeeded the JS P3 that had been running since 2015, scoring hundreds of wins and multiple championships across global and international series. It represented major changes from its predecessor in bodywork and suspension, and added traction control and a new, more powerful Nissan V8 engine as part of a new generation of LMP3 regulations.
      
      In its first two seasons as a part of the top-level IMSA WeatherTech SportsCar Championship, Ligier entries dominated the LMP3 class. Riley Motorsports finished first and third in the standings in 2021, led by driver’s champion Gar Robinson, while the CORE Autosport duo of Colin Braun and Jon Bennett finished second in that inaugural season before winning the title in 2022. For 2024 and beyond, the JS P320 and all other LMP3s will compete exclusively in the IMSA VP Racing SportsCar Challenge, where it will be the faster car in multi-class racing exclusively alongside GT4 cars.
      
      Thanks again for your purchase, and we’ll see you on the track!
      
      ![Image](./assets/ligier-js-p320/welcome-car.png)

