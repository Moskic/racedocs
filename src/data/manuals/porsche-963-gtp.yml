  - id: provided-setups
    level: 3
    titleZh: 随附设置
    titleEn: PROVIDED SETUPS
    bodyZh: |+
      PORSCHE 963 GTP 提供 12 个 iRacing 设置：

      #### BASELINE

      高下压力设置的略微稳定版本，适合首次驾驶本车的车手，或希望获得比高下压力设置更高稳定性的车手。

      #### HIGH DOWNFORCE

      适用于大多数赛道。该设置效率相当高并能产生最多下压力，但也会产生最大的阻力。

      #### MEDIUM DOWNFORCE

      适用于 Spa 等拥有长直道的赛道。牺牲更多下压力和效率，以换取更高的直线速度。

      #### LOW DOWNFORCE

      适用于勒芒。下压力和阻力配置最低。

      #### DAYTONA

      低下压力设置的变体，适用于 Daytona，并作出调整以避免在椭圆赛道倾斜弯道上触底。

      #### DAYTONA 24H

      Daytona 设置的变体，专门考虑一年中的时间、预期天气以及 24 小时比赛设置的要求。

      除固定 IMSA 设置外，所有设置的燃油量均为 89 L，这是本车的最大油箱容量。

      #### FIXED

      为官方 IMSA 固定系列设置的高下压力配置，燃油量受限。

      #### FIXED QUAL

      固定系列设置，使用排位赛燃油量和混合动力释放。

      #### FIXED LEMANS

      为官方 IMSA 固定系列设置的低下压力配置，燃油量受限。

      #### FIXED LEMANS QUAL

      固定低下压力系列设置，使用排位赛燃油量和混合动力释放。

      #### FIXED DAYTONA

      Daytona 设置，使用受限燃油量，适用于官方 IMSA 固定系列。

      #### FIXED DAYTONA QUAL

      Daytona 系列设置，使用排位赛燃油量和混合动力释放。

    bodyEn: |+
      There are 12 iRacing setups provided for the PORSCHE 963 GTP:

      #### BASELINE

      A slightly more stable version of the high downforce setup for a driver’s first time in the car or for those wanting more stability than the high downforce setup provides.

      #### HIGH DOWNFORCE

      For use at most tracks. Although quite efficient and creating the most downforce, this setup also makes the most drag.

      #### MEDIUM DOWNFORCE

      For use at track with long straights like Spa. Sacrificing more downforce and efficiency for more straight line speed.

      #### LOW DOWNFORCE

      For use at Le Mans. Lowest drag and downforce trim.

      #### DAYTONA

      A variation of the Low Downforce setup for use at Daytona with changes to avoid bottoming on the oval banking.

      #### DAYTONA 24H

      A variation on the Daytona setup made specifically with time of year, expected weather, and the demands of a 24 hour race setup in mind.

      The fuel level in all setups (except the fixed IMSA setups) are set to 89 L, which is the maximum tank capacity for this car.

      #### FIXED

      The high downforce setup with limited fuel for the official IMSA fixed series.

      #### FIXED QUAL

      The fixed series setup with qualifying fuel and hybrid deployment.

      #### FIXED LEMANS

      The low downforce setup with limited fuel for the official IMSA fixed series.

      #### FIXED LEMANS QUAL

      The fixed LDF series setup with qualifying fuel and hybrid deployment.

      #### FIXED DAYTONA

      The Daytona setup with limited fuel for the official IMSA fixed series.

      #### FIXED DAYTONA QUAL

      The Daytona series setup with qualifying fuel and hybrid deployment.

  - id: aerodynamic-height-targets
    level: 3
    titleZh: 空气动力学车高目标
    titleEn: AERODYNAMIC HEIGHT TARGETS
    bodyZh: |+
      Porsche 963 在平均后车高约 45 mm、平均前车高约 25 mm 时产生的下压力最大。

      更大的车身俯仰角（相对于前车高更高的后车高）会使空气动力学平衡前移（转向过度）；较小的俯仰角则相反。

      在不改变侧倾刚度的情况下，可以在赛道上通过调整前部垂向弹簧和后部第三弹簧来影响动态车高。

      较软的后部第三弹簧会让车辆后部在空气动力学负荷下下沉，但由于后车高会明显低于最佳效率所需的目标车高（45 mm），车辆会在弯中损失部分下压力和效率。因此需要在阻力／下压力和动态空气动力学平衡之间作出妥协。

    bodyEn: |+
      The Porsche 963 generates the most downforce with an average rear ride height around 45mm and an average front ride height around 25mm.

      More rake (high rear ride heights compared to front ride heights) will move aero balance forward (oversteer) and less rake will do the opposite.

      You can affect the dynamic ride heights (without changing the roll stiffness) on track by adjusting the front heave spring and the rear third spring.

      A soft rear third spring will allow the rear of the car to drop under aero load but you will lose some amount of downforce and efficiency mid corner as the rear ride heights will be well under the target rear heights for maximum efficiency (45mm). Some compromises will need to be made regarding drag/downforce and dynamic aero balance.

  - id: rear-wing-adjustment
    level: 3
    titleZh: 后翼调节
    titleEn: REAR WING ADJUSTMENT
    bodyZh: |+
      如果选择调整设置，改变设置平衡最简单的方法是调节后翼角度。一般来说，如果发现需要将翼角向任一方向调整超过一格，建议从其他下压力配置（高、中或低）之一开始。

      - 较低翼角 = 更多转向过度、更少下压力和更高直线速度。
      - 较高翼角 = 更多转向不足、更多下压力和更低直线速度。

    bodyEn: |+
      Should you choose to make adjustments to the setup the easiest way to change the balance of the setup is through adjustment of the rear wing angle. Generally speaking if you find you want to adjust wing position in more than a click in either direction it is recommended you start from one of the other downforce trim setups (high, medium, or low).

      - Lower wing angle = More oversteer, less downforce and higher straight line speed.
      - Higher wing angle = More understeer, more downforce and lower straight line speed.

  - id: height-adjustments
    level: 3
    titleZh: 车高调节
    titleEn: HEIGHT ADJUSTMENTS
    bodyZh: |+
      如果希望在不改变下压力／阻力配置的情况下改变空气动力学平衡，可以通过增大或减小后部推杆长度偏移来调节后车高。由于本车产生的下压力很大，这几乎会在所有位置影响平衡，但在中高速弯中尤其明显。

      - 较低推杆长度偏移 = 较低后车高、较小俯仰角、更靠后的空气动力学平衡（转向不足）。
      - 较高推杆长度偏移 = 较高后车高、较大俯仰角、更靠前的空气动力学平衡（转向过度）。

    bodyEn: |+
      If you would like to change the aero balance without changing the downforce/drag trim adjust the rear ride height by increasing or decreasing the rear pushrod length offset.This will affect balance just about everywhere as we are making a lot of downforce but this will be particularly noticeable in mid and high speed corners.

      - Lower pushrod length offset = Lower rear ride height, less rake, a more rearward aero balance (understeer).
      - Higher pushrod length offset = Higher rear ride height, more rake, a more forward aero balance (oversteer).

  - id: rear-differential-adjustment
    level: 3
    titleZh: 后差速器调节
    titleEn: REAR DIFFERENTIAL ADJUSTMENT
    bodyZh: |+
      后差速器是 Porsche 中的强力调节工具。您可以自由尝试各种设置。最简单的改动是增大或减小预载。虽然调整预载会影响加油时的行为，但您可能会更明显地感受到它对入弯和切入弯心的影响。

      - 更多预载 = 松开油门时旋转更少，入弯时稳定性更高。
      - 更少预载 = 松开油门时旋转更多，入弯时稳定性更低。

    bodyEn: |+
      The rear differential is a powerful tool in the Porsche. Feel free to experiment with the various settings. The simplest change one can make is increasing or decreasing the preload. While adjusting the preload will affect the on throttle behavior you will probably notice more of a change on entry and turn in.

      - More preload = Less rotation off throttle, more stability on entry.
      - Less preload = More rotation off throttle, less stability on entry.
