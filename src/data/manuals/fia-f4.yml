  - id: introduction
    level: 2
    titleZh: "简介"
    titleEn: "INTRODUCTION"
    bodyZh: |+
      本指南旨在帮助您深入理解车库中可用的底盘设置选项，以便按照个人偏好调校车辆。

      不过，在深入调整底盘之前，最好先熟悉车辆和赛道。为此，我们为这些赛车经常使用的各条赛道提供了基准设置。要载入基准设置，只需打开“车库”，单击“iRacing 设置”，然后为所选赛道选择合适的设置。如果某条赛道没有专用基准设置，可以选择特性相近赛道的设置作为起点。

      选择合适的设置后，请驶上赛道并专注于跑出平顺且稳定的圈次，找准正确的赛车线，同时在连续多圈中观察轮胎磨损和操控趋势。

      当您确信使用随车提供的基准设置已接近自身驾驶极限后，请继续阅读，开始按照个人操控偏好调校车辆。

    bodyEn: |+
      The information found in this guide is intended to provide a deeper understanding of the chassis setup adjustments available in the garage, so that you may use the garage to tune the chassis setup to your preference.

      Before diving into chassis adjustments, though, it is best to become familiar with the car and track. To that end, we have provided baseline setups for each track commonly raced by these cars. To access the baseline setups, simply open the Garage, click iRacing Setups, and select the appropriate setup for your track of choice. If you are driving a track for which a dedicated baseline setup is not included, you may select a setup for a similar track to use as your baseline.

      After you have selected an appropriate setup, get on track and focus on making smooth and consistent laps, identifying the proper racing line and experiencing tire wear and handling trends over a number of laps.

      Once you are confident that you are nearing your driving potential with the included baseline setups, read on to begin tuning the car to your handling preferences.

  - id: getting-started
    level: 3
    titleZh: "快速上手"
    titleEn: "GETTING STARTED"
    bodyZh: |+
      ![快速上手](./assets/fia-f4/getting-started.png)

      启动车辆前，建议先为制动力分配调整映射控制按键。虽然这并非必要操作，但可让您在赛道上根据驾驶需求快速调整制动力分配。

      进入车辆后，只需拉动“升挡”拨片挂入挡位，再踩下油门踏板即可起步。本车采用自动化序列式变速箱，升挡和降挡均无须手动操作离合器。

      建议在仪表台上的换挡提示灯全部亮起时升挡，对应转速为 7000 RPM。

    bodyEn: |+
      ![Image](./assets/fia-f4/getting-started.png)

      Before starting the car, it is recommended to map a control for Brake Bias adjustment. While this is not mandatory, this will allow you to make quick changes to the brake bias to suit your driving while out on track.

      Once you load into the car, getting started is as easy as pulling the “upshift” paddle to put it into gear, and hitting the accelerator pedal. This car uses an automated sequential transmission and does not require manual clutch operation to shift in either direction.

      Upshifting is recommended when the shift lights on the dashboard are all fully illuminated. This is at 7000 rpm.

  - id: loading-an-iracing-setup
    level: 3
    titleZh: "载入 iRacing 设置"
    titleEn: "LOADING AN iRACING SETUP"
    bodyZh: |+
      ![载入 iRacing 设置](./assets/fia-f4/loading-iracing-setup.png)

      进入比赛会话后，车辆会自动载入 iRacing 基准设置 `<baseline.sto>`。如果您希望使用 iRacing 针对不同条件预制的其他设置，可以依次单击“车库 &gt; iRacing 设置 &gt;”，再选择符合需求的设置。

      如需自定义设置，只需在车库中完成所需修改，然后单击“应用”。若要保存设置供日后使用，请单击右侧的“另存为”，为修改后的设置命名并保存。

      要查看所有个人设置，请单击车库右侧的“我的设置”。

      如需与另一位车手或会话中的所有人共享设置，可以单击车库右侧的“共享”。如果其他车手正在与您共享设置，也可以在车库右侧的“共享设置”中找到该设置。

    bodyEn: |+
      ![Image](./assets/fia-f4/loading-iracing-setup.png)

      Upon loading into a session, the car will automatically load the iRacing Baseline setup `<baseline.sto>`. If you would prefer one of iRacing’s pre-built setups that suit various conditions, you may load it by clicking Garage &gt; iRacing Setups &gt; and then selecting the setup to suit your needs.

      If you would like to customize the setup, simply make the changes in the garage that you would like to update and click apply. If you would like to save your setup for future use click “Save As” on the right to name and save the changes.

      To access all of your personally saved setups, click “My Setups” on the right side of the garage.

      If you would like to share a setup with another driver or everyone in a session, you can select “Share” on the right side of the garage to do so. If a driver is trying to share a setup with you, you will find it under “Shared Setups” on the right side of the garage as well.

