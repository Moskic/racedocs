sections:
  - id: preamble
    level: 2
    bodyZh: |+
      ![欢迎页面](./assets/fia-f4/welcome-hero.png)

      #### 亲爱的 iRacing 用户：

      恭喜您购买 FIA F4！iRacing 全体成员感谢您的支持以及对我们产品的认可。我们致力于提供极致的模拟赛车体验，也希望您驾驶新车时能在赛道上尽享激情！

      FIA F4 的开发呼应了在全球范围内大幅提升赛车运动参与度的共同目标。随着第二代入门级方程式赛车于 2022 年推出，FIA F4 采用了 iRacing 会员所熟悉的同等水准分析、细节、数据和测试；同时，通用化车型不与特定制造商产生冲突，可供世界各地的国家级汽车运动俱乐部使用。

      本指南将说明如何充分发挥新车的性能，涵盖从赛道外的车辆设置调整，到驾驶时在座舱内看到的各种信息。希望本指南能帮助您快速上手。

      再次感谢您的购买，我们赛道上见！

      ![FIA F4 赛车](./assets/fia-f4/welcome-car.png)

    bodyEn: |+
      ![Image](./assets/fia-f4/welcome-hero.png)

      #### DEAR iRACING USER,

      Congratulations on your purchase of the FIA F4! From all of us at iRacing, we appreciate your support and your commitment to our product. We aim to deliver the ultimate sim racing experience, and we hope that you’ll find plenty of excitement with us behind the wheel of your new car!

      The FIA F4 has been developed in conjunction with the global effort to massively increase the participation of motorsport worldwide. Following the introduction of a second-generation entry-level open-wheel formula in 2022, the FIA F4 benefits from the same level of analysis, detail, data, and testing as our members have come to expect while the genericized model allows for use by national clubs world-over without manufacturer conflicts.

      The following guide explains how to get the most out of your new car, from how to adjust its settings off of the track to what you’ll see inside of the cockpit while driving. We hope that you’ll find it useful in getting up to speed.

      Thanks again for your purchase, and we’ll see you on the track!

      ![Image](./assets/fia-f4/welcome-car.png)

