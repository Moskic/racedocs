sections:
  - id: preamble
    level: 2
    bodyZh: |+
      ![图示](./assets/dallara-p217-lmp2/welcome-hero.png)
      
      #### 亲爱的 iRacing 用户：
      
      恭喜您购买 Dallara P217 LMP2！iRacing 全体成员感谢您的支持以及对我们产品的认可。我们致力于提供极致的模拟赛车体验，也希望您驾驶新车时能在赛道上尽享激情！
      
      P217 于 2017 年首次亮相，标志着 Dallara 自初代 Audi R18 TDI 之后重返原型车赛事。该车参加 FIA 世界耐力锦标赛和欧洲勒芒系列赛的 LMP2 组别；得益于与通用汽车的合作，其 Daytona Prototype International 规格版本则以 Cadillac 品牌征战 IMSA WeatherTech 跑车锦标赛最高组别。
      
      LMP2 规格的 P217 搭载 4.2 升 Gibson V8 发动机和 Xtrac 六速序列式拨片变速箱。该车首次参加勒芒 24 小时时的车手包括 Formula 1 名将 Rubens Barrichello、前勒芒冠军 Jan Lammers 和 IndyCar 老将 Mikhail Aleshin。其他曾驾驶该车参加勒芒的 Formula 1 车手还包括 Felipe Nasr、Sergey Sirotkin 和 Giedo van der Garde。
      
      本指南将说明如何充分发挥新车的性能，涵盖从赛道外的车辆设置调整，到驾驶时在座舱内看到的各种信息。希望本指南能帮助您快速上手。
      
      再次感谢您的购买，我们赛道上见！
      
      ![图示](./assets/dallara-p217-lmp2/welcome-car.png)

    bodyEn: |+
      ![Image](./assets/dallara-p217-lmp2/welcome-hero.png)
      
      #### DEAR iRACING USER,
      
      Congratulations on your purchase of the Dallara P217 LMP2! From all of us at iRacing, we appreciate your support and your commitment to our product. We aim to deliver the ultimate sim racing experience, and we hope that you’ll find plenty of excitement with us behind the wheel of your new car!
      
      Dallara’s return to prototype racing for the first time since the original Audi R18 TDI, the P217 made its debut in 2017. The car competes in the LMP2 class in both the FIA World Endurance Championship and European Le Mans Series, while a Daytona Prototype International-spec version of the car races at the top level of the IMSA WeatherTech SportsCar Championship with Cadillac branding as part of a relationship with General Motors.
      
      The LMP2 P217 is powered by a 4.2-liter Gibson V8, and features a six-speed sequential paddle shift transmission by Xtrac. Drivers who raced in the car in its 24 Hours of Le Mans debut included Formula 1 legend Rubens Barrichello, former Le Mans winner Jan Lammers, and IndyCar veteran Mikhail Aleshin. Other Formula 1 veterans who have driven the car at Le Mans include Felipe Nasr, Sergey Sirotkin, and Giedo van der Garde.
      
      The following guide explains how to get the most out of your new car, from how to adjust its settings off of the track to what you’ll see inside of the cockpit while driving. We hope that you’ll find it useful in getting up to speed.
      
      Thanks again for your purchase, and we’ll see you on the track!
      
      ![Image](./assets/dallara-p217-lmp2/welcome-car.png)

