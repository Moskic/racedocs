  - id: introduction
    level: 2
    titleZh: 简介
    titleEn: INTRODUCTION
    bodyZh: |+
      本指南旨在帮助您深入理解车库中可用的底盘设置选项，以便按照个人偏好调校底盘设置。

      不过，在深入调整底盘之前，最好先熟悉车辆和赛道。为此，我们为这些赛车经常使用的各条赛道提供了基准设置。要载入基准设置，只需打开“车库”，单击“iRacing 设置”，然后为所选赛道选择合适的设置。如果某条赛道没有专用基准设置，可以选择特性相近赛道的设置作为起点。

      选择合适的设置后，请驶上赛道并专注于跑出平顺且稳定的圈次，找准正确的赛车线，同时在连续多圈中观察轮胎磨损和操控趋势。

      当您确信使用随车提供的基准设置已接近自身驾驶极限后，请继续阅读，开始按照个人操控偏好调校车辆。

    bodyEn: |+
      The information found in this guide is intended to provide a deeper understanding of the chassis setup adjustments available in the garage, so that you may use the garage to tune the chassis setup to your preference.

      Before diving into chassis adjustments, though, it is best to become familiar with the car and track. To that end, we have provided baseline setups for each track commonly raced by these cars. To access the baseline setups, simply open the Garage, click iRacing Setups, and select the appropriate setup for your track of choice. If you are driving a track for which a dedicated baseline setup is not included, you may select a setup for a similar track to use as your baseline.

      After you have selected an appropriate setup, get on track and focus on making smooth and consistent laps, identifying the proper racing line and experiencing tire wear and handling trends over a number of laps.

      Once you are confident that you are nearing your driving potential with the included baseline setups, read on to begin tuning the car to your handling preferences.

  - id: getting-started
    level: 3
    titleZh: 快速上手
    titleEn: GETTING STARTED
    bodyZh: |+
      ![快速上手](./assets/cadillac-v-series-r-gtp/getting-started.png)

      启动车辆前，建议先为制动力分配和牵引力控制系统设置映射控制按键。虽然这并非驾驶本车所必需，但这样可以在赛道上根据个人驾驶风格快速调整驾驶辅助系统。

      进入车辆后，只需按下“升挡”按钮挂入挡位，再踩下油门踏板即可起步。本车采用序列式变速箱，升挡或降挡均不需要踩离合器。不过，若降挡保护系统判断当前车速对于所选挡位过高、可能导致发动机损坏，就不会允许降挡；此时降挡指令会被直接忽略。建议在方向盘上的所有换挡提示灯变为红色时升挡。

    bodyEn: |+
      ![Image](./assets/cadillac-v-series-r-gtp/getting-started.png)

      Before starting the car, it is recommended to map controls to adjust the Brake Bias and Traction Control systems. While this is not mandatory to drive the car, this will allow you to make quick changes to the driver aid systems to suit your driving style while out on the track.

      Once you load into the car, getting started is as easy as selecting the “upshift” button to put it into gear, and hitting the accelerator pedal. This car uses a sequential transmission and does not require a clutch input to shift up or down. However, the car’s downshift protection will not allow you to downshift if it feels you are traveling too fast for the gear selected and would incur engine damage. In these situations the downshift command will simply be ignored. Upshifting is recommended when all of the shift lights on the steering wheel have changed to red.

  - id: loading-an-iracing-setup
    level: 3
    titleZh: 载入 iRacing 设置
    titleEn: LOADING AN iRACING SETUP
    bodyZh: |+
      ![载入 iRacing 设置](./assets/cadillac-v-series-r-gtp/loading-iracing-setup.png)

      进入比赛会话后，车辆会自动载入 iRacing 基准设置 [baseline.sto]。如果您希望使用 iRacing 针对不同条件预制的其他设置，可以依次单击“车库 &gt; iRacing 设置 &gt;”，再选择符合需求的设置。

      如需自定义设置，只需在车库中完成所需修改，然后单击“应用”。若要保存设置供日后使用，请单击右侧的“另存为”，为修改后的设置命名并保存。

      要查看所有个人设置，请单击车库右侧的“我的设置”。如需与另一位车手或会话中的所有人共享设置，可以单击车库右侧的“共享”。

      如果其他车手正在与您共享设置，也可以在车库右侧的“共享设置”中找到该设置。

    bodyEn: |+
      ![Image](./assets/cadillac-v-series-r-gtp/loading-iracing-setup.png)

      Upon loading into a session, the car will automatically load the iRacing Baseline setup [baseline.sto]. If you would prefer one of iRacing’s pre-built setups that suit various conditions, you may load it by clicking Garage &gt; iRacing Setups &gt; and then selecting the setup to suit your needs.

      If you would like to customize the setup, simply make the changes in the garage that you would like to update and click apply. If you would like to save your setup for future use click “Save As” on the right to name and save the changes.

      To access all of your personally saved setups, click “My Setups” on the right side of the garage. If you would like to share a setup with another driver or everyone in a session, you can select “Share” on the right side of the garage to do so.

      If a driver is trying to share a setup with you, you will find it under “Shared Setups” on the right side of the garage as well.

  - id: dash-configuration
    level: 2
    titleZh: 仪表配置
    titleEn: DASH CONFIGURATION
    bodyZh: |+
      与车辆性能和车手可调设置相关的重要信息，都可以在集成于 Cadillac V-Series.R GTP 方向盘中的数字显示屏上找到。

      ![仪表配置](./assets/cadillac-v-series-r-gtp/dashboard-configuration.png)

      | 左列 | 含义 |
      | --- | --- |
      | REM（燃油） | 油箱剩余燃油量，单位为加仑或升 |
      | DELTA（燃油） | 当前每圈燃油用量与预设燃油用量目标之间的差值 |
      | LAPS（燃油） | 油箱耗尽前预计剩余的圈数 |
      | TRGT（燃油） | 每圈燃油用量目标，由车库中的 Fuel Target 设置 |
      | Tire Temps | 每条轮胎的平均表面温度，单位为 °F 或 °C |
      | BBT | Brake Bias Target 设置 |
      | BBM | Base Brake Pressure Bias 设置 |
      | MIG | Brake Bias Migration 设置 |
      | TC A | 当前 Traction Control Gain 设置 |
      | RED | |
      | EPAS | Power Steering Assist 等级 |

      | 中列 | 含义 |
      | --- | --- |
      | Speed | 车辆速度，单位为英里/小时或公里/小时 |
      | Gear Indicator | 当前选择的变速箱挡位 |
      | Tire Press | 实时轮胎胎压，单位为 PSI 或 kPa。数值背景会发生变化：胎压不足显示为蓝色，胎压过高显示为红色，最佳胎压显示为黑色背景。 |

      | 右列 | 含义 |
      | --- | --- |
      | Lap | 当前圈数 |
      | DELTA（s） | 当前圈与本节最佳圈之间的实时时间差 |
      | LAST | 上一圈完成时间 |
      | SoC | 当前混合动力系统荷电状态（State of Charge）等级 |
      | ARB F | 前防倾杆叶片设置 |
      | ARB R | 后防倾杆叶片设置 |
      | ECU A | |
      | ECU B | |
      | PEDAL | 当前油门踏板扭矩映射设置 |
      | BLUE | |
      | TC B | 当前 Traction Control Slip 设置 |

    bodyEn: |+
      Vital information relating to the car’s performance and driver-adjustable settings can all be found on the digital display integrated into the Cadillac V-Series R GTP’s steering wheel.

      ![Image](./assets/cadillac-v-series-r-gtp/dashboard-configuration.png)

      | Left Column | Value |
      | --- | --- |
      | REM (fuel) | Amount of fuel remaining in the fuel tank in gallons or liters |
      | DELTA (fuel) | Difference between current per-lap fuel usage and the pre-set fuel usage target |
      | LAPS (fuel) | Estimated number of laps remaining before the fuel tank is empty |
      | TRGT (fuel) | Target per-lap fuel usage, set by the Fuel Target setting in the garage |
      | Tire Temps | Average surface temperature of each tire in °F or °C |
      | BBT | Brake Bias Target setting |
      | BBM | Base Brake Pressure Bias setting |
      | MIG | Brake Bias Migration setting |
      | TC A | Current Traction Control Gain setting |
      | RED | |
      | EPAS | Power Steering Assist level |

      | Center Column | Value |
      | --- | --- |
      | Speed | Vehicle speed in miles-per-hour or kilometers-per-hour |
      | Gear Indicator | Currently selected transmission gear |
      | Tire Press | Live tire pressures, shown in PSI or kPa. The background of these values will change, with underinflated tires shown in blue, overinflated tires in red, and optimum pressures shown with a black background. |

      | Right Column | Value |
      | --- | --- |
      | Lap | Current lap number |
      | DELTA (s) | Live time difference between the current lap and the session best lap |
      | LAST | Previously completed lap time |
      | SoC | Current Hybrid System State of Charge level |
      | ARB F | Front ARB blade setting |
      | ARB R | Rear ARB blade setting |
      | ECU A | |
      | ECU B | |
      | PEDAL | Current throttle pedal torque map setting |
      | BLUE | |
      | TC B | Current Traction Control Slip setting |

  - id: wheelspin-brake-lock-indicator-lights
    level: 3
    titleZh: 车轮空转 / 制动锁死指示灯
    titleEn: WHEELSPIN / BRAKE LOCK INDICATOR LIGHTS
    bodyZh: |+
      仪表盘方向盘后方设有两组 LED 灯，用于快速向车手提示是否发生车轮空转或制动锁死。左侧 LED 灯组对应左侧车轮，右侧灯组对应右侧车轮。

      ![牵引力控制指示灯](./assets/cadillac-v-series-r-gtp/wheelspin-traction-control.png)

      | 指示灯 | 说明 |
      | --- | --- |
      | 牵引力控制 | 当灯组全部亮起蓝色时，表示牵引力控制系统正在介入以减少车轮空转。严重的车轮空转和 TC 系统介入会产生持续亮起的蓝灯；TC 介入程度较小时，灯会开始闪烁。 |

      ![制动锁死指示灯](./assets/cadillac-v-series-r-gtp/wheelspin-brake-lockup.png)

      | 指示灯 | 说明 |
      | --- | --- |
      | 制动锁死 | 当制动力足以开始锁死车轮时，LED 会亮起，显示发生锁死的车轮以及锁死程度。粉色灯表示前轮锁死，黄色灯表示后轮锁死；亮起的 LED 越多，锁死越严重。上图显示两个前轮均已锁死，左后轮有轻微锁死。 |

    bodyEn: |+
      Two sets of LED lights are situated behind the steering wheel on the dash to quickly communicate to the driver if any wheelspin or brake lockup is occurring. The left LED cluster corresponds to the left wheels and the right cluster corresponds to the right wheels.

      ![Image](./assets/cadillac-v-series-r-gtp/wheelspin-traction-control.png)

      | Indicator | Description |
      | --- | --- |
      | Traction Control | When the clusters light up all LEDs in blue the Traction Control system is intervening to reduce wheelspin. Severe cases of wheelspin and TC system activation will produce a solid blue light and the lights will begin flashing for less amounts of TC intervention. |

      ![Image](./assets/cadillac-v-series-r-gtp/wheelspin-brake-lockup.png)

      | Indicator | Description |
      | --- | --- |
      | Brake Lockup | Whenever braking force is sufficient to begin locking a wheel the LEDs will illuminate to show both which wheel is locking and how severe the lockup is. Pink lights indicate front wheel lockup and yellow lights indicate rear wheel lockups, with lockups becoming more severe with more LEDs illuminated. The image above shows both front wheels locked with a slight lockup on the left-rear wheel. |

  - id: shift-lights
    level: 3
    titleZh: 换挡提示灯
    titleEn: SHIFT LIGHTS
    bodyZh: |+
      ![转速换挡提示灯](./assets/cadillac-v-series-r-gtp/shift-lights-rpm.png)

      方向盘顶部设有一组灯，用于在加速时帮助车手判断何时升入下一挡。随着转速升高，灯会从左至右依次亮起，颜色由绿色开始，右侧以两颗红色 LED 结束。

      ![最佳换挡点](./assets/cadillac-v-series-r-gtp/shift-lights-optimum.png)

      达到最佳换挡点后，所有 LED 都会变为蓝色并开始闪烁。

    bodyEn: |+
      ![Image](./assets/cadillac-v-series-r-gtp/shift-lights-rpm.png)

      The top of the steering wheel has a set of lights to help the driver know when to shift up to the next gear while accelerating. As RPM increases, the lights will illuminate from the left to right starting with green and ending with two red LEDs on the right.

      ![Image](./assets/cadillac-v-series-r-gtp/shift-lights-optimum.png)

      Once the optimum shift point has been reached all LEDs will change to blue and begin flashing.

  - id: pit-limiter
    level: 3
    titleZh: 进站限速器
    titleEn: PIT LIMITER
    bodyZh: |+
      ![维修区限速器](./assets/cadillac-v-series-r-gtp/pit-limiter.png)

      维修区限速器启用时，换挡提示灯和屏幕背景都会变为蓝色，系统工作期间换挡提示灯会闪烁。混合动力系统的 SoC 指示器会变为车辆速度。

    bodyEn: |+
      ![Image](./assets/cadillac-v-series-r-gtp/pit-limiter.png)

      Whenever the Pit Speed Limiter is active shift lights and the screen’s background will change to blue, with the shift lights flashing while the system is active. The Hybrid System’s SoC indicator will change to vehicle speed.

  - id: advanced-setup-options
    level: 2
    titleZh: 高级设置选项
    titleEn: ADVANCED SETUP OPTIONS
    bodyZh: |+
      > 本节面向希望深入了解车辆设置不同方面的进阶用户。调整以下参数并非必需，而且可能显著改变车辆的操控方式。建议以递增方式进行任何调整，每次只修改一个变量，然后测试改动效果。

    bodyEn: |+
      > This section is aimed toward more advanced users who want to dive deeper into the different aspects of the vehicle’s setup. Making adjustments to the following parameters is not required and can lead to significant changes in the way a vehicle handles. It is recommended that any adjustments are made in an incremental fashion and only singular variables are adjusted before testing changes.

  - id: tires-aero
    level: 2
    titleZh: 轮胎与空气动力学
    titleEn: TIRES & AERO

  - id: tire-data
    level: 3
    titleZh: 轮胎数据
    titleEn: TIRE DATA
    bodyZh: |+
      ![轮胎数据](./assets/cadillac-v-series-r-gtp/tire-data.png)

      #### 轮胎类型

      选择车辆载入赛道时安装的轮胎类型。干地或光头胎用于干燥赛道条件，Wet 湿胎用于下雨和湿滑赛道条件。

      #### 初始胎压

      车辆载入赛道时轮胎中的空气压力。较低的胎压会提供更多抓地力，但会产生更大的滚动阻力并更快升温。较高的胎压会让车辆响应略快并产生更小的滚动阻力，但会降低抓地力。通常，高速赛道更适合较高胎压；在机械抓地力很重要的低速赛道，较低胎压效果更好。

      #### 最后热胎压

      车辆完成一段赛道行驶返回车库后，显示的轮胎压力会标记为热胎压。冷胎压与热胎压的差异，是了解轮胎在赛道上承受多大负荷和工作强度的好方法。承受更多工作的轮胎会建立更高的压力；关注哪些轮胎压力升高更多，并相应调整冷胎压，对于优化轮胎性能可能至关重要。

      #### 最后温度

      车辆从赛道返回后，会显示轮胎胎体温度（在胎面内部测量）。这些温度可以有效判断某条轮胎在赛道上承受了多少工作或负荷。内侧与外侧温度的差异可用于调校单个车轮的定位；中心温度则可与外侧温度比较，以帮助调校胎压。

      #### 剩余胎面

      轮胎剩余胎面以新胎的百分比显示在温度下方。这些数值有助于判断一套轮胎还能使用多远、何时需要更换，但不一定能像温度那样说明轮胎是否承受了过多或过少的工作。

    bodyEn: |+
      ![Image](./assets/cadillac-v-series-r-gtp/tire-data.png)

      #### TIRE TYPE

      Selects which type of tire is installed on the car when loaded into the world. Dry, or slick, tires are used for dry racing conditions while Wet tires are intended for raining and wet track conditions.

      #### STARTING PRESSURE

      The air pressure in the tires when the car is loaded into the world. Lower pressures will provide more grip but will produce more rolling drag and build temperature faster. Higher pressures will feel slightly more responsive and produce less rolling drag, but will result in less grip. Generally, higher pressures are preferred at tracks where speeds are higher while lower pressures work better at slower tracks where mechanical grip is important.

      #### LAST HOT PRESSURE

      When the car returns to the garage after an on-track stint, the tire pressure will be displayed as Hot Pressure. The difference between cold and hot pressure is a good way to see how tires are being loaded and worked while on track. Tires seeing more work will build more pressure, and paying attention to which tires are building more pressure and adjusting cold pressure to compensate can be crucial for optimizing tire performance.

      #### LAST TEMPS

      The tire carcass temperatures (measured within the tread) are displayed after the car returns from the track. These temperatures are an effective way to determine how much work or load a given tire is experiencing while on track. Differences between the inner and outer temperatures can be used to tune individual wheel alignment and the center temperatures can be compared to the outer temperatures to help tune tire pressure.

      #### TREAD REMAINING

      The amount of tread on the tire, displayed as a percentage of a new tire, is shown below the tire temperatures. These values are good for determining how far a set of tires can go before needing to be replaced, but don’t necessarily indicate an under- or over-worked tire in the same way temperatures will.

  - id: aero-settings
    level: 3
    titleZh: 空气动力学设置
    titleEn: AERO SETTINGS
    bodyZh: |+
      ![空气动力学设置](./assets/cadillac-v-series-r-gtp/aero-settings.png)

      #### 后翼角度

      后翼角度设置会改变翼面元件的迎角。增大翼角会增加翼面产生的下压力，但也会增加阻力；减小翼角则会降低翼面产生的下压力，同时降低阻力。后翼角度会强烈影响后部下压力，进而显著影响中高速弯中的车尾抓地力。

      #### 空气动力学计算器

      空气动力学计算器用于显示特定配置下车辆近似的空气动力学数值。改变车辆空气动力学设置后，计算器中的数值也会更新，从而帮助判断车辆在赛道上的空气动力学表现。该计算器还可用于确定需要对车辆进行哪些改动，以缓解空气动力学导致的操控问题。

      #### 前 / 后高速车高

      高速车高（RH at Speed）用于向空气动力学计算器提供计算参考高度。使用空气动力学计算器时，应通过遥测在赛道任意位置确定车辆的前、后车高，并将该数值输入“Front RH at Speed”设置。

      #### 下压力平衡

      该数值以车头下压力的百分比显示，表示车辆总下压力中位于前轴上方的比例。百分比越高，说明前部下压力越大，中高速弯中的转向过度越明显；百分比越低，说明后部下压力越大，中高速弯中的转向不足越明显。

      #### 升力 / 阻力比（L/D）

      “L/D”数值是升力（下压力）与阻力的比值，用于量化车身产生下压力时所带来的阻力。L/D 越高，表示每单位阻力产生的下压力越多，也就是车身效率越高。在不牺牲总下压力的情况下，提高 L/D 会带来更快、更高效的车辆。L/D 的最佳值会因空气动力学配置和赛道类型而异。

    bodyEn: |+
      ![Image](./assets/cadillac-v-series-r-gtp/aero-settings.png)

      #### REAR WING ANGLE

      The rear wing angle setting changes the Angle of Attack of the wing elements. Increasing wing angle increases the downforce generated by the wing but increases drag, while decreasing the wing angle reduces the downforce generated by the wing while reducing drag. Rear wing angle has a heavy influence on rear downforce, having a heavy influence on rear-end grip in mid- to high-speed corners.

      #### AERO CALCULATOR

      The Aero Calculator is a tool used to display the car’s approximate aerodynamic values in a given configuration. Changes to the car’s aerodynamic settings will be reflected in the Aero Calculator, giving an idea of how the car will behave aerodynamically while on the race track. This calculator can also be used to determine what changes need to be made to the car to alleviate aerodynamically-induced handling issues.

      #### FRONT/REAR RH AT SPEED

      The Ride Height (RH) at Speed is used to give the Aero Calculator heights to reference for aerodynamic calculations. When using the aero calculator, determine the car’s Front and Rear Ride height via telemetry at any point on track and input that value into the “Front RH at Speed” setting.

      #### DOWNFORCE BALANCE

      Displayed in percent of Front downforce, this value shows how much of the car’s total downforce is over the front axle. A higher percentage value indicates more front downforce, increasing oversteer in mid- to high-speed corners and a lower percentage value indicates more rear downforce, increasing understeer in mid- to high-speed corners.

      #### L/D

      The “L/D” value is the ratio of Lift (downforce) to Drag. This quantifies how efficiently the car’s bodywork is producing downforce in terms of how much drag is being produced as a result. A higher L/D value means more downforce is being produced for each unit of drag, meaning the bodywork is being more efficient. Having a higher L/D value without sacrificing overall downforce will result in a faster, more efficient car. Optimum values for L/D can vary based on the aerodynamic configuration and track type.

