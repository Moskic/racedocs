  - id: front
    level: 3
    titleZh: "前部"
    titleEn: "FRONT"
    bodyZh: |+
      ![前部设置](./assets/formula-vee/front.png)

      #### 防倾杆直径

      防倾杆（ARB）的尺寸会影响前悬架的侧倾刚度，例如车辆过弯时的侧倾刚度。增大防倾杆尺寸会提高前悬架的侧倾刚度，从而减少车身侧倾，但增加机械性转向不足；在某些情况下，也会让车手感到转向响应更加灵敏。相反，减小防倾杆尺寸会降低悬架侧倾刚度，增加车身侧倾但减少机械性转向不足。此时转向响应感可能减弱，但前轴抓地力会提高。

      共有 4 种防倾杆直径可选，范围从 9.53 mm / ⅜ in（最软）到 19.05 mm / ¾ in（最硬）。需要特别注意的是，Formula Vee 没有后防倾杆，后弹簧也不参与车辆的侧倾刚度，因此前防倾杆与前弹簧的组合刚度决定了车辆的总侧倾刚度。正因如此，实车通常使用较硬的前防倾杆，有时甚至会采用最硬的选项。

      #### 弹簧预载

      通过改变弹簧的安装预载来调整车辆这一端的车高。增加圈数会降低车辆前部车高，减少圈数则会提高车辆前部车高。

      #### 制动力分配

      制动力分配表示分配给前制动器的制动力百分比。数值高于 50% 时，前制动管路压力会高于后制动管路，使制动平衡前移，增加前轮锁止倾向，但也可能提高制动区内的整体稳定性。应结合车手偏好和赛道条件进行调校，以在具体情形下获得最佳制动表现。

      #### 屏幕颜色

      数字仪表背景提供 7 种颜色可选：灰色、青色、蓝色、绿色、黄色、红色和紫色。此选项既可在车内调整，也可在车库中调整。

    bodyEn: |+
      ![Image](./assets/formula-vee/front.png)

      #### ARB DIAMETER

      The ARB (Anti-Roll Bar) size influences the stiffness of the front suspension in roll, such as when navigating a corner. Increasing the ARB size will increase the roll stiffness of the front suspension, resulting in less body roll but increasing mechanical understeer. This can also, in some cases, lead to a more responsive steering feel from the driver. Conversely, reducing the ARB size will soften the suspension in roll, increasing body roll but decreasing mechanical understeer. This can result in a less-responsive feel from the steering, but grip across the front axle will increase.

      4 ARB diameters are available ranging from 9.53 mm / ⅜” inch (softest) to 19.05 mm / ¾” inch (stiffest). Of particular note is that there is no Rear ARB in the Formula Vee, nor does the rear spring contribute to the roll stiffness of the car, this means that the Front ARB and Front Spring combined rates dictate the total roll stiffness of the car. As such, in the real car it is common to use a stiff (sometimes the stiffest available) Front ARB.

      #### SPRING PRELOAD

      Used to adjust the ride height at this end of the car by changing the installed preload of the spring, increasing the number of turns will lower the front ride height of the car while reducing the number of turns will raise the front ride height of the car.

      #### BRAKE PRESSURE BIAS

      Brake Bias is the percentage of braking force that is being sent to the front brakes. Values above 50% result in greater pressure in the front brake line relative to the rear brake line which will shift the brake balance forwards increasing the tendency to lock up the front tires but potentially increasing overall stability in braking zones. This should be tuned for both driver preference and track conditions to get the optimum braking performance for a given situation.

      #### SCREEN COLOR

      A choice of 7 different colors are available for the digital dash background: Gray, Cyan, Blue, Green, Yellow, Red and Purple. This option is adjustable from within the car as well as the garage.

  - id: front-corners
    level: 3
    titleZh: "左／右前轮"
    titleEn: "LEFT/RIGHT FRONT"
    bodyZh: |+
      ![左右前轮设置](./assets/formula-vee/front-corners.png)

      #### 单轮载荷

      车辆静止在车库中时各条轮胎下方承受的重量。正确分配车辆各处重量，对针对特定赛道和条件优化车辆至关重要。由于各车轮的推杆不可调整，Formula Vee 的单轮载荷不容易改变。不过，使用非对称设置时，仍可能观察到单轮载荷存在一定差异。

      #### 车高

      地面到车辆底盘参考点的距离，此处为底盘前端下缘，而非车鼻。调整车高对获得最佳性能至关重要，因为它会直接影响机械抓地力。提高前车高会使过弯时前轴发生更多载荷转移，多数情况下会增加转向不足；降低前车高则会减少前轴载荷转移、增加转向过度，并因重心高度下降而提升整体性能。

      随着车高降低，应提高弹簧刚度以作补偿并防止触底。通常，在不过度接触赛道表面的前提下，尽可能低的实际车高会带来最佳表现；平整顺滑的赛道可以使用比粗糙起伏赛道更低的车高。规则允许的最低前车高为 25.4 mm（1.0 in）。

      #### 减振器设置

      同时改变线性减振器的压缩与回弹整体阻尼；数值越大表示阻尼越强，0 为最小阻尼，5 为最大阻尼。较高设置会让瞬态动作中外侧轮胎更快承载，使车辆对车手而言响应更灵敏，并提高制动稳定性；不过，在颠簸赛道上，过强阻尼会使轮胎负荷变化增大，从而导致整体抓地力下降。

      #### 外倾角

      外倾角是车轮相对于底盘中心的垂直夹角。车轮顶部比底部更靠近底盘中心线称为负外倾，轮胎顶部比底部更向外则称为正外倾。受悬架几何和过弯负荷影响，四个车轮通常都需要负外倾。增大负外倾角的绝对值可提高轮胎产生的横向力，但会降低制动时的纵向抓地力。外倾角过大虽然可能产生很强的过弯力，也会显著缩短轮胎寿命，因此需要在耐久性与性能之间取得平衡。增大前轮负外倾角的绝对值通常会提高中高速弯中的前轴抓地力，但会降低制动性能，因此需要将制动力分配向后调整作为补偿。

      #### 前束

      从上方观察时，前束角是车轮相对于底盘中心线的夹角。车轮前缘比后缘更靠近中心线称为正前束，车轮前缘比后缘更远离中心线则称为负前束。在前轴，前束会改变轮胎对转向输入的响应速度，并影响车辆的直线稳定性。负前束设置（车库中显示为负值）会提高初始转向响应，但降低直线稳定性；正前束（车库中显示为正值）会提高直线稳定性，但使初始转向响应变得迟缓。

    bodyEn: |+
      ![Image](./assets/formula-vee/front-corners.png)

      #### CORNER WEIGHT

      The weight underneath each tire under static conditions in the garage. Correct weight arrangement around the car is crucial for optimizing a car for a given track and conditions. For the Formula Vee this cannot be easily influenced as individual corner pushrods are non-adjustable. However, when running asymmetrical setups some difference in corner weights may still be observed.

      #### RIDE HEIGHT

      Distance from ground to a reference point on the chassis, in this case the lower leading edge of the chassis (not the nose). Adjusting ride heights is key for optimum performance as they directly impact the mechanical grip. Increasing front ride height will allow for more weight transfer across the front axle while cornering, this will lead to an increase in understeer in most cases while lowering the front ride height will decrease weight transfer across the front axle, increase oversteer and provide an increase in overall performance through a reduction in CG height.

      As ride height decreases the spring rate should be increased to compensate and prevent bottoming, typically, the lowest practical ride height without excessive track contact will result in the best performance with smooth flat tracks allowing for lower ride heights than rough and undulating ones. Minimum legal front ride height is 25.4 mm (1.0” inch).

      #### SHOCK SETTING

      Changes the overall damping of this linear shock in both compression and rebound; higher numbers indicate more damping with 0 being minimum damping and 5 being maximum damping. Higher settings will result in faster loading of the outside tire in transient maneuvers which can make the car feel more responsive to the driver and increase braking stability, however, at rough tracks excessive damping can lead to a loss in overall grip as the tire is subject to greater load variation.

      #### CAMBER

      Camber is the vertical angle of the wheel relative to the center of the chassis. Negative camber is when the top of the wheel is closer to the chassis centerline than the bottom of the wheel, positive camber is when the top of the tire is farther out than the bottom. Due to suspension geometry and corner loads, negative camber is desired on all four wheels. Higher negative camber values will increase the cornering force generated by the tire, but will reduce the amount of longitudinal grip the tire will have under braking. Excessive camber values can produce very high cornering forces but will also significantly reduce tire life, so it is important to find a balance between life and performance. Increasing front camber values will typically result in increased front axle grip during mid to high speed cornering but will result in a loss of braking performance and necessitate a rearward shift in brake bias to compensate.

      #### TOE-IN

      Toe is the angle of the wheel, looking from vertical, relative to the chassis centerline. Toe-in is when the front of the wheels are closer to the centerline while Toe-out is when the front of the wheels are farther from the centerline than the rear of the tires. On the front end, Toe will alter how quickly the tires respond to steering inputs and influence how stable the car is in a straight line. Toe-out settings (negative garage value) will increase turn-in response and make the car less stable in a straight line, while Toe-in (positive garage value) will increase straight-line stability while making initial steering response more sluggish.

  - id: rear-corners
    level: 3
    titleZh: "左／右后轮"
    titleEn: "LEFT/RIGHT REAR"
    bodyZh: |+
      ![左右后轮设置](./assets/formula-vee/rear-corners.png)

      #### 外倾角

      由于 Formula Vee 采用摆动半轴式后悬架设计，后轮外倾角不容易改变；不过，这种设计会使外倾角随悬架垂直行程发生显著变化，因此车库界面仍会显示该数值，帮助理解悬架状态。虽然外倾角无法直接调整，但可通过后悬架的其他参数影响，包括推杆偏移量（限制最大下垂行程）、弹簧座偏移量（设置静态车高）以及弹簧刚度（增减负荷造成的行程量）。

      与前轮一样，后轮采用负外倾有助于提高过弯时的横向抓地力，而接近零的数值则会提高制动和加速时的纵向抓地力。尤其需要确保制动过程中外倾角不会变为正值，否则横向和纵向性能都会下降，并加剧收油转向过度。

      #### 前束

      后轮通常采用正前束。增加正前束可提高直线稳定性，但会降低变向时的响应。应尽可能避免过大的正前束，因为这会增加滚动阻力并降低直线速度。一般建议保持左右前束值相同，以避免车辆斜行或产生不对称操控；不过，在 Lime Rock Park 这类高度不对称的赛道上，采用非对称后轮前束及其他设置参数可能有助于提高性能。

    bodyEn: |+
      ![Image](./assets/formula-vee/rear-corners.png)

      #### CAMBER

      Due to the swing axle rear suspension design of the Formula Vee, rear camber cannot easily be changed however, this design results in significant amounts of camber change with vertical suspension travel and is therefore tracked within the garage to aid in this understanding. While it cannot be directly adjusted it can be influenced through other parameters in the rear suspension such as pushrod offset (to limit maximum droop travel), spring perch offset (to set the static ride height) and spring rate (increases or decreases the amount of travel due to load).

      As at the front of the car, it is desirable to have negative camber at the rear for increased lateral grip during cornering while values closer to zero will increase longitudinal grip during braking and acceleration. Of particular importance is ensuring that the camber does not become positive during braking events, this will lead to a loss of both lateral and longitudinal capability and exacerbate lift-off oversteer events.

      #### TOE-IN

      At the rear of the car it is typical to run toe-in. Increases in toe-in will result in improved straight line stability and a reduction in response during direction changes. Large values of toe-in should be avoided if possible as this will increase rolling drag and reduce straight line speeds. Generally, it is advised to keep the left and right toe values equal to prevent crabbing or asymmetric handling behavior; however, heavily asymmetric tracks such as Lime Rock Park may see a benefit in performance from running asymmetric configurations of rear toe and other setup parameters.

  - id: rear
    level: 3
    titleZh: "后部"
    titleEn: "REAR"
    bodyZh: |+
      ![后部设置](./assets/formula-vee/rear.png)

      #### 后车高

      地面到车身后部底盘参考点的距离，此处为底盘后端下缘。提高后车高会使过弯时后轴发生更多载荷转移（转向过度增加）；相反，降低车高会减少后轴载荷转移（转向不足增加）。后车高是调节机械平衡和外倾角的关键参数，为改善后轮外倾角控制，可能需要牺牲一定的车高控制。规则允许的最低后车高为 114 mm（4.5 in），最高后车高为 152 mm（6.0 in）。

      #### 推杆偏移量

      主要用于调整后悬架的下垂（伸长）行程，也可用于调整后车高。必须与弹簧座偏移量配合使用，才能达到预期目标。在缩短推杆的同时减小弹簧座偏移量以保持车高不变，可以减少下垂行程；这样可在制动过程中加强外倾角控制，降低外倾角变为正值的倾向，并可能减少收油转向过度。不过，过度限制下垂行程会使内侧后轮抬离赛道；由于车辆采用开放式差速器，这会导致驱动力损失，因此并不可取。

      #### 弹簧座偏移量

      通过改变弹簧的安装位置来调整车辆后部车高。增大弹簧座偏移量会降低车辆后部车高，减小弹簧座偏移量则会提高车辆后部车高。如上所述，此参数会与推杆偏移量配合使用，以改变后悬架的最大下垂行程。

      #### 弹簧刚度

      Formula Vee 后弹簧的安装方式类似于高下压力原型车或方程式赛车的第三弹簧，这意味着它只负责控制俯仰／垂向运动，并不参与后悬架的侧倾刚度。因此，较硬的后弹簧可缩小高、低负荷状态间的车高变化，并改善车身平台与外倾角控制，但代价是整体机械抓地力下降。

      这一缺点在低速弯出口激进加油时尤其明显；硬弹簧在此类情况下往往表现较差，在颠簸赛道上更是如此，并会导致明显的牵引力损失。弹簧刚度应根据赛道需求进行匹配，使车辆在高速和低速弯中的操控平衡保持一致。

      例如，若车辆高速弯转向不足、低速弯转向过度，提高后弹簧刚度可能有益。这样可以使用更低的静态后车高，减少低速过弯时后轴载荷转移，同时在高速过弯时维持甚至提高后车高，从而减少转向不足。共有 6 种弹簧刚度可选，范围从 13 N/mm（75 lbs/in）到 35 N/mm（200 lbs/in），每级增加 4.4 N/mm（25 lbs/in）。每次更改弹簧刚度后，都必须调整弹簧座偏移量，使车辆恢复到之前的静态车高。

      #### 减振器设置

      同时改变线性减振器的压缩与回弹整体阻尼；数值越大表示阻尼越强，0 为最小阻尼，5 为最大阻尼。较高设置会让加速过程中后轮更快承载，并可能提高平整赛道上的后轮牵引力；不过，在颠簸赛道上，过强阻尼会使轮胎负荷变化增大，从而导致整体抓地力下降。与弹簧一样，这支减振器在侧倾过程中不起作用。

      #### 燃油量

      油箱中的燃油量。油箱容量为 20 L（5.3 gal），以 1 L（0.26 gal）为增量进行调整。

    bodyEn: |+
      ![Image](./assets/formula-vee/rear.png)

      #### REAR RIDE HEIGHT

      Distance from ground to a reference point on the rear of the chassis, in this case the lower trailing edge of the chassis. Increasing rear ride height will allow for more weight transfer across the rear axle when cornering (more oversteer). Conversely, reducing ride height will reduce the weight transfer across the rear axle (more understeer). Rear ride height is a critical tuning component for mechanical balance and camber considerations, it may be necessary to trade-off some ride height control for improved rear camber control. Minimum legal ride height is 114 mm (4.5” inches), maximum legal ride height is 152 mm (6.0” inches).

      #### PUSHROD OFFSET

      Primarily used to adjust the droop (extension) travel of the rear suspension but can be used to adjust the rear ride height. This must be used in conjunction with the spring perch offset to achieve the desired goal. Reducing the pushrod length while reducing the spring perch offset to keep a constant ride height results in a reduction in droop travel; this results in increased camber control (reduced tendency to become positive) during braking events and potentially reduced lift-off oversteer. However, excessive droop limitation can lead to the inside rear wheel lifting off the track which is undesirable as this will result in a loss of forward drive due to the use of an open differential.

      #### SPRING PERCH OFFSET

      Used to adjust the rear ride height at this end of the car by changing the installed position of the spring, increasing the spring perch offset will lower the rear ride height of the car while increasing the spring perch offset will raise the rear ride height of the car. As noted above, it is utilized in conjunction with pushrod offset to alter maximum droop travel of the rear suspension.

      #### SPRING RATE

      The installation of the rear spring in the Formula Vee is similar to that of a heave spring in a high downforce prototype or open wheel car, this means that the spring is only effective at controlling pitch/heave moments and does not contribute to the roll stiffness of the rear suspension. As such, a stiffer rear spring will result in a smaller variance in ride height between high and low load cases and will provide improved platform and camber control at the expense of overall mechanical grip.

      This can be particularly prominent when exiting slow speed corners with aggressive throttle application. A stiffer spring will tend to react poorly during these instances especially so on rough tracks which will result in significant traction loss. Spring stiffness should be matched to the needs of the racetrack and set such that the handling balance is consistent between high and low speed cornering.

      As an example case, a car which suffers from high speed understeer but low speed oversteer could benefit from an increase in rear spring stiffness. This will allow for a lower static rear height which will reduce rear weight transfer during slow speed cornering while maintaining or even increasing the rear ride height in high speed cornering to reduce understeer. 6 options for spring rate are available ranging from 13 N/mm (75 lbs/in) to 35 N/mm (200 lbs/in) in 4.4 N/mm (25 lbs/in) steps. Spring perch offset must be adjusted to return the car to the prior static ride height after any spring rate change.

      #### SHOCK SETTING

      Changes the overall damping of this linear shock in both compression and rebound; higher numbers indicate more damping with 0 being minimum damping and 5 being maximum damping. Higher settings will result in faster loading of the rear tires during acceleration events and can increase rear traction on smooth tracks. However, at rough tracks excessive damping can lead to a loss in overall grip as the tire is subject to greater load variation. As with the spring, the shock has no impact during roll events.

      #### FUEL LEVEL

      The amount of fuel in the fuel tank. Tank capacity is 20 L (5.3 g). Adjustable in 1 L (0.26 g) increments.
