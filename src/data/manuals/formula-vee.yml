sections:
  - id: preamble
    level: 2
    bodyZh: |+
      ![欢迎页面](./assets/formula-vee/welcome-hero.png)

      #### 亲爱的 iRacing 用户：

      恭喜您购买 Formula Vee！iRacing 全体成员感谢您的支持以及对我们产品的认可。我们致力于提供极致的模拟赛车体验，也希望您驾驶新车时能在赛道上尽享激情！

      赛车运动中最富传奇色彩的初级方程式组别之一现已加入 iRacing！Formula Vee 以 1963 年以前生产的大众甲壳虫原厂零部件为基础，将其与管状车架底盘以及玻璃纤维或碳纤维开轮式车身结合。自 1964 年起，它便一直是 SCCA Runoffs 全国锦标赛的一部分，并在世界各地广受欢迎；从 Niki Lauda 到 Keke Rosberg 等传奇车手，都曾驾驶这些经典赛车开启自己的职业生涯。

      本指南将说明如何充分发挥新车的性能，涵盖从赛道外的车辆设置调整，到驾驶时在座舱内看到的各种信息。希望本指南能帮助您快速上手。

      再次感谢您的购买，我们赛道上见！

      ![Formula Vee 赛车](./assets/formula-vee/welcome-car.png)

    bodyEn: |+
      ![Image](./assets/formula-vee/welcome-hero.png)

      #### DEAR iRACING USER,

      Congratulations on your purchase of the Formula vee! From all of us at iRacing, we appreciate your support and your commitment to our product. We aim to deliver the ultimate sim racing experience, and we hope that you’ll find plenty of excitement with us behind the wheel of your new car!

      One of the most legendary junior open-wheel racing formulas is part of iRacing! The Formula Vee is based on the stock parts a pre-1963 Volkswagen Beetle, combining them with a tubeframe chassis and fiberglass or carbon fiber open-wheel body. Part of the SCCA Runoffs since 1964, the cars have also proven highly popular around the world, with iconic names from Niki Lauda to Keke Rosberg starting their careers in these venerable machines.

      The following guide explains how to get the most out of your new car, from how to adjust its settings off of the track to what you’ll see inside of the cockpit while driving. We hope that you’ll find it useful in getting up to speed.

      Thanks again for your purchase, and we’ll see you on the track!

      ![Image](./assets/formula-vee/welcome-car.png)

