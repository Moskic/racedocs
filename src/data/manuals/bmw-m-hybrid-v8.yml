sections:
  - id: preamble
    level: 2
    bodyZh: |+
      ![图示](./assets/bmw-m-hybrid-v8/welcome-hero.png)
      
      #### 亲爱的 iRacing 用户：
      
      恭喜您购买 BMW M Hybrid V8！iRacing 全体成员衷心感谢您的支持，以及您对我们产品的信赖。我们致力于提供极致的模拟赛车体验，也希望您驾驶这台新赛车时，能与我们一同尽享赛道激情！
      
      本指南将说明如何充分发挥新车的性能，涵盖从赛道外的车辆设置调整，到驾驶时在座舱内看到的各种信息。希望本指南能帮助您快速上手。
      
      再次感谢您的购买，我们赛道上见！
      
      ![图示](./assets/bmw-m-hybrid-v8/welcome-car.png)

    bodyEn: |+
      ![Image](./assets/bmw-m-hybrid-v8/welcome-hero.png)
      
      #### DEAR iRACING USER,
      
      Congratulations on your purchase of the BMW M Hybrid V8 LMDh! From all of us at iRacing, we appreciate your support and your commitment to our product. We aim to deliver the ultimate sim racing experience, and we hope that you’ll find plenty of excitement with us behind the wheel of your new car!
      
      The following guide explains how to get the most out of your new car, from how to adjust its settings off of the track to what you’ll see inside of the cockpit while driving. We hope that you’ll find it useful in getting up to speed.
      
      Thanks again for your purchase, and we’ll see you on the track!
      
      ![Image](./assets/bmw-m-hybrid-v8/welcome-car.png)

