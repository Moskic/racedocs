  - id: introduction
    level: 2
    titleZh: 简介
    titleEn: INTRODUCTION
    bodyZh: |+
      本指南旨在帮助您深入理解车库中可用的底盘设置选项，以便按照个人偏好调校车辆。
      
      不过，在深入调整底盘之前，最好先熟悉车辆和赛道。为此，我们为这些赛车经常使用的各条赛道提供了基准设置。要载入基准设置，只需打开“车库”，单击“iRacing 设置”，然后为所选赛道选择合适的设置。如果某条赛道没有专用基准设置，可以选择特性相近赛道的设置作为起点。
      
      选择合适的设置后，请驶上赛道并专注于跑出平顺且稳定的圈次，找准正确的赛车线，同时在连续多圈中观察轮胎磨损和操控趋势。
      
      当您确信使用随车提供的基准设置已接近自身驾驶极限后，请继续阅读，开始按照个人操控偏好调校车辆。

    bodyEn: |+
      The information found in this guide is intended to provide a deeper understanding of the chassis setup adjustments available in the garage, so that you may use the garage to tune the chassis setup to your preference.
      
      Before diving into chassis adjustments, though, it is best to become familiar with the car and track. To that end, we have provided baseline setups for each track commonly raced by these cars. To access the baseline setups, simply open the Garage, click iRacing Setups, and select the appropriate setup for your track of choice. If you are driving a track for which a dedicated baseline setup is not included, you may select a setup for a similar track to use as your baseline.
      
      After you have selected an appropriate setup, get on track and focus on making smooth and consistent laps, identifying the proper racing line and experiencing tire wear and handling trends over a number of laps.
      
      Once you are confident that you are nearing your driving potential with the included baseline setups, read on to begin tuning the car to your handling preferences.

  - id: getting-started
    level: 3
    titleZh: 快速上手
    titleEn: GETTING STARTED
    bodyZh: |+
      ![图示](./assets/bmw-m-hybrid-v8/getting-started-cockpit.png)
      
      ![图示](./assets/bmw-m-hybrid-v8/getting-started-car.png)
      
      启动车辆前，建议先为制动力分配和牵引力控制系统设置映射控制按键。虽然这并非驾驶本车所必需，但这样可以在赛道上根据个人驾驶风格快速调整驾驶辅助系统。
      
      进入车辆后，只需按下“升挡”按钮挂入挡位，再踩下油门踏板即可起步。本车采用序列式变速箱，升挡或降挡均不需要踩离合器。不过，若降挡保护系统判断当前车速对于所选挡位过高、可能导致发动机损坏，就不会允许降挡；此时降挡指令会被直接忽略。建议在方向盘上的所有换挡提示灯变为红色时升挡。

    bodyEn: |+
      ![Image](./assets/bmw-m-hybrid-v8/getting-started-cockpit.png)
      
      ![Image](./assets/bmw-m-hybrid-v8/getting-started-car.png)
      
      Before starting the car, it is recommended to map controls to adjust the Brake Bias and Traction Control systems. While this is not mandatory to drive the car, this will allow you to make quick changes to the driver aid systems to suit your driving style while out on the track.
      
      Once you load into the car, getting started is as easy as selecting the “upshift” button to put it into gear, and hitting the accelerator pedal. This car uses a sequential transmission and does not require a clutch input to shift up or down. However, the car’s downshift protection will not allow you to downshift if it feels you are traveling too fast for the gear selected and would incur engine damage. In these situations the downshift command will simply be ignored. Upshifting is recommended when all of the shift lights on the steering wheel have changed to red.

  - id: loading-an-iracing-setup
    level: 3
    titleZh: 载入 iRacing 设置
    titleEn: LOADING AN iRACING SETUP
    bodyZh: |+
      ![图示](./assets/bmw-m-hybrid-v8/loading-iracing-setup.png)
      
      进入会话时，车辆会自动载入 iRacing 基准设置 [baseline.sto]。如果您希望使用 iRacing 针对各种条件预制的其他设置，可依次单击“车库 &gt; iRacing 设置 &gt;”，再选择符合需求的设置。
      
      如需自定义设置，只需在车库中完成所需修改，然后单击“应用”。若要保存设置供日后使用，请单击右侧的“另存为”，为修改后的设置命名并保存。
      
      要查看所有个人保存的设置，请单击车库右侧的“我的设置”。如需与另一位车手或会话中的所有人共享设置，可以单击车库右侧的“共享”。
      
      如果其他车手正在与您共享设置，也可以在车库右侧的“共享设置”中找到该设置。

    bodyEn: |+
      ![Image](./assets/bmw-m-hybrid-v8/loading-iracing-setup.png)
      
      Upon loading into a session, the car will automatically load the iRacing Baseline setup [baseline.sto]. If you would prefer one of iRacing’s pre-built setups that suit various conditions, you may load it by clicking Garage &gt; iRacing Setups &gt; and then selecting the setup to suit your needs.
      
      If you would like to customize the setup, simply make the changes in the garage that you would like to update and click apply. If you would like to save your setup for future use click “Save As” on the right to name and save the changes.
      
      To access all of your personally saved setups, click “My Setups” on the right side of the garage. If you would like to share a setup with another driver or everyone in a session, you can select “Share” on the right side of the garage to do so.
      
      If a driver is trying to share a setup with you, you will find it under “Shared Setups” on the right side of the garage as well.

  - id: dash-configuration
    level: 2
    titleZh: 仪表配置
    titleEn: DASH CONFIGURATION
    bodyZh: |+
      与车辆性能和车手可调设置相关的重要信息，都可以在集成于 BMW M Hybrid V8 方向盘中的数字显示屏上找到。
      
      ![图示](./assets/bmw-m-hybrid-v8/dashboard-configuration.png)
      
      | 左侧区域 | 数值 |
      | --- | --- |
      | 轮胎压力 | 各轮胎的当前气压会实时更新，单位为 PSI 或 bar。 |
      | 单圈燃油 | 上一圈消耗的燃油量，每圈结束时更新，单位为加仑或升。 |
      | Fuel Used | 车辆上次加油后消耗的燃油量，单位为加仑或升。 |
      | SOC | 当前电池电量百分比。 |
      
      | 中央区域 | 数值 |
      | --- | --- |
      | RPM | 当前发动机转速显示在中央区域顶部 |
      | Gear Indicator | 当前挡位以大号数字显示在屏幕中央。 |
      | BEAM | 车辆夜间照明系统开启时，此指示会出现在中央区域左下方。 |
      | Tyre | 不可用 |
      | BRKB | 不可用 |
      
      | 右侧区域 | 数值 |
      | --- | --- |
      | TC1 | 显示当前牵引力控制增益设置 |
      | TC2 | 显示当前牵引力控制滑移设置 |
      | FARB | 显示当前前防倾杆设置 |
      | RARB | 显示当前后防倾杆设置 |
      | 预计圈速 | 车载系统会根据分段时间和当前表现预测本圈圈速，并显示在右上方。 |
      | Last Lap | 上一圈完成时间，每圈结束时更新显示 |
      | Best Lap | 当前赛段的最快圈速 |
      | TMOT | 发动机冷却液温度，单位为 °F 或 °C |
      | TOIL | 发动机机油温度，单位为 °F 或 °C |
      | LAP | 显示当前赛段已完成的圈数 |
      | PWAT | 发动机冷却液压力，单位为 PSI 或 bar |
      | POIL | 发动机机油系统压力，单位为 PSI 或 bar |
      | TGBX | 变速箱油温，单位为 °F 或 °C |

    bodyEn: |+
      Vital information relating to the car’s performance and driver-adjustable settings can all be found on the digital display integrated into the BMW M Hybrid V8 LMDh’s steering wheel.
      
      ![Image](./assets/bmw-m-hybrid-v8/dashboard-configuration.png)
      
      | Left Column | Value |
      | --- | --- |
      | Tyre Pressure | Current air pressure in each tire, updated live and displayed in either PSI or Bar. |
      | Lap Fuel | The amount of fuel used in the previous lap, in either gallons or liters, is updated at the end of each lap. |
      | Fuel Used | The amount of fuel that has been used, in gallons or liters, since the fuel was last added to the car. |
      | SOC | Current battery charge level, in percent. |
      
      | Center Column | Value |
      | --- | --- |
      | RPM | The current engine RPM is shown at the top of the center section |
      | Gear Indicator | The currently-selected gear is shown as a large number in the center of the display. |
      | BEAM | If the car’s nighttime light system is on, this indicator will appear in the lower left of the center area. |
      | Tyre | Inoperable |
      | BRKB | Inoperable |
      
      | Right Column | Value |
      | --- | --- |
      | TC1 | Displays the current Traction Control Gain setting |
      | TC2 | Displays the current Traction Control Slip setting |
      | FARB | Displays the current setting for the Front Anti-Roll Bar |
      | RARB | Displays the current setting for the Rear Anti-Roll Bar |
      | Lap Predict | The onboard systems will attempt to predict the current lap time based on splits and performance and display it in the top right. |
      | Last Lap | The previously completed lap time, updated and displayed at the end of each lap |
      | Best Lap | The fastest lap of the current session |
      | TMOT | The engine’s cooling fluid temperature, in either °F or °C |
      | TOIL | Engine oil temperature, in either °F or °C |
      | LAP | Displays the number of laps completed in the current session |
      | PWAT | Engine cooling fluid pressure, in PSI or Bar |
      | POIL | Engine Oil system pressure, in PSI or Bar |
      | TGBX | Gearbox oil temperature, in °F or °C |

  - id: wheelspin-brake-lock-indicator-lights
    level: 3
    titleZh: 车轮空转 / 制动锁死指示灯
    titleEn: WHEELSPIN / BRAKE LOCK INDICATOR LIGHTS
    bodyZh: |+
      仪表盘方向盘后方设有两组 LED 灯，用于快速向车手提示是否发生车轮空转或制动锁死。左侧 LED 灯组对应左侧车轮，右侧灯组对应右侧车轮。
      
      ![图示](./assets/bmw-m-hybrid-v8/traction-control-indicator.png)
      
      当灯组全部亮起蓝色时，表示牵引力控制系统正在介入以减少车轮空转。严重的车轮空转和 TC 系统介入会产生持续亮起的蓝灯；TC 介入程度较小时，灯会开始闪烁。
      
      ![图示](./assets/bmw-m-hybrid-v8/brake-lockup-indicator.png)
      
      当制动力足以开始锁死车轮时，LED 会亮起，显示发生锁死的车轮以及锁死程度。粉色灯表示前轮锁死，黄色灯表示后轮锁死；亮起的 LED 越多，锁死越严重。上图显示两个前轮均已锁死，左后轮有轻微锁死。

    bodyEn: |+
      Two sets of LED lights are situated on the dash to quickly communicate to the driver if any wheelspin or brake lockup is occurring. The left LED cluster corresponds to the left wheels and the right cluster corresponds to the right wheels.
      
      ![Image](./assets/bmw-m-hybrid-v8/traction-control-indicator.png)
      
      When the clusters light up all LEDs in blue the Traction Control system is intervening to reduce wheelspin. Severe cases of wheelspin and TC system activation will produce a solid blue light and the lights will begin flashing for less amounts of TC intervention.
      
      ![Image](./assets/bmw-m-hybrid-v8/brake-lockup-indicator.png)
      
      Whenever braking force is sufficient to begin locking a wheel the LEDs will illuminate to show both which wheel is locking and how severe the lockup is. Pink lights indicate front wheel lockup and yellow lights indicate rear wheel lockups, with lockups becoming more severe with more LEDs illuminated. The image above shows both front wheels locked with a slight lockup on the left-rear wheel.

  - id: shift-lights
    level: 3
    titleZh: 换挡提示灯
    titleEn: SHIFT LIGHTS
    bodyZh: |+
      ![图示](./assets/bmw-m-hybrid-v8/shift-lights-rpm.png)
      
      方向盘顶部设有一组灯，用于在加速时帮助车手判断何时升入下一挡。随着转速升高，灯会从左至右依次亮起，颜色由绿色开始，右侧以两颗红色 LED 结束。
      
      ![图示](./assets/bmw-m-hybrid-v8/shift-lights-optimum.png)
      
      达到最佳换挡点后，所有 LED 都会变为红色并开始闪烁。

    bodyEn: |+
      ![Image](./assets/bmw-m-hybrid-v8/shift-lights-rpm.png)
      
      The top of the steering wheel has a set of lights to help the driver know when to shift up to the next gear while accelerating. As RPM increases, the lights will illuminate from the left to right starting with green and ending with two red LEDs on the right.
      
      ![Image](./assets/bmw-m-hybrid-v8/shift-lights-optimum.png)
      
      Once the optimum shift point has been reached all LEDs will change to red and begin flashing.

  - id: pit-limiter
    level: 3
    titleZh: 维修区限速器
    titleEn: PIT LIMITER
    bodyZh: |+
      ![图示](./assets/bmw-m-hybrid-v8/pit-limiter.png)
      
      维修区限速器启用时，仪表会在挡位指示器旁显示一个写有 PSL 的洋红色方框。

    bodyEn: |+
      ![Image](./assets/bmw-m-hybrid-v8/pit-limiter.png)
      
      Whenever the Pit Speed Limiter is active the dash will feature a magenta box next to the gear indicator with PSL displayed.

  - id: advanced-setup-options
    level: 2
    titleZh: 高级设置选项
    titleEn: ADVANCED SETUP OPTIONS
    bodyZh: |+
      > 本节面向希望深入了解车辆各项设置的高级用户。调整以下参数并非必要，而且可能显著改变车辆的操控特性。建议所有调整都采用循序渐进的方式，每次只更改一个变量，并在继续调整前先测试效果。

    bodyEn: |+
      > This section is aimed toward more advanced users who want to dive deeper into the different aspects of the vehicle’s setup. Making adjustments to the following parameters is not required and can lead to significant changes in the way a vehicle handles. It is recommended that any adjustments are made in an incremental fashion and only singular variables are adjusted before testing changes.

  - id: tires-and-aero
    level: 2
    titleZh: 轮胎与空气动力学
    titleEn: TIRES & AERO
  - id: tire-data
    level: 3
    titleZh: 轮胎数据
    titleEn: TIRE DATA
    bodyZh: |+
      ![图示](./assets/bmw-m-hybrid-v8/tire-data.png)
      
      #### 最后温度（LAST TEMPS）
      
      | 轮胎类型（TIRE TYPE） | 数值 |
      | --- | --- |
      | 选择车辆载入赛道时安装的轮胎类型。干地胎（即光头胎）用于干燥比赛条件，湿地胎则用于降雨和湿滑赛道条件。 | 车辆返回车库后，会显示轮胎胎体温度（在胎面内部测量）。这些温度可以有效判断各条轮胎在赛道上承受的工作量或负荷。内、外侧温差可用于调整单轮定位；中央温度与外侧温度的对比则有助于调整胎压。 |
      | 车辆载入赛道时的轮胎气压。较低胎压可提供更多抓地力，但会产生更大的滚动阻力，升温也更快。较高胎压的响应感略强、滚动阻力更小，但抓地力会降低。通常，高速赛道更适合较高胎压；在更强调机械抓地力的低速赛道上，较低胎压表现更好。 | 胎温下方以新胎百分比显示剩余胎面厚度。这些数值适合判断一套轮胎还能行驶多远才需要更换，但不像胎温那样能够直接反映轮胎工作不足或过度工作的状态。 |
      
      车辆完成一个赛道行驶阶段并返回车库后，轮胎气压会显示为热态胎压。冷、热态胎压的差值有助于判断各条轮胎在赛道上的负荷与工作强度。工作量更大的轮胎会产生更大的胎压升幅；留意哪些轮胎升压更多，并通过调整冷态胎压进行补偿，对于优化轮胎性能至关重要。
      
      #### 初始胎压（STARTING PRESSURE）
      
      #### 剩余胎纹（TREAD REMAINING）
      
      #### 最后热胎压（LAST HOT PRESSURE）

    bodyEn: |+
      ![Image](./assets/bmw-m-hybrid-v8/tire-data.png)
      
      #### LAST TEMPS
      
      | TIRE TYPE | Value |
      | --- | --- |
      | Selects which type of tire is installed on the car when loaded into the world. Dry, or slick, tires are used for dry racing conditions while Wet tires are intended for raining and wet track conditions. | The tire carcass temperatures (measured within the tread) are displayed after the car returns from the track. These temperatures are an effective way to determine how much work or load a given tire is experiencing while on track. Differences between the inner and outer temperatures can be used to tune individual wheel alignment and the center temperatures can be compared to the outer temperatures to help tune tire pressure. |
      | The air pressure in the tires when the car is loaded into the world. Lower pressures will provide more grip but will produce more rolling drag and build temperature faster. Higher pressures will feel slightly more responsive and produce less rolling drag, but will result in less grip. Generally, higher pressures are preferred at tracks where speeds are higher while lower pressures work better at slower tracks where mechanical grip is important. | The amount of tread on the tire, displayed as a percentage of a new tire, is shown below the tire temperatures. These values are good for determining how far a set of tires can go before needing to be replaced, but don’t necessarily indicate an under- or over-worked tire in the same way temperatures will. |
      
      When the car returns to the garage after an on-track stint, the tire pressure will be displayed as Hot Pressure. The difference between cold and hot pressure is a good way to see how tires are being loaded and worked while on track. Tires seeing more work will build more pressure, and paying attention to which tires are building more pressure and adjusting cold pressure to compensate can be crucial for optimizing tire performance.
      
