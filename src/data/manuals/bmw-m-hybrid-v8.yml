  - id: rear-corners
    level: 3
    titleZh: 后轮角
    titleEn: REAR CORNERS
    bodyZh: |+
      ![图示](./assets/bmw-m-hybrid-v8/rear-corners.png)
      
      #### 弹簧座高偏移
      
      | 角重（CORNER WEIGHT） | 数值 |
      | --- | --- |
      | 车库静态条件下每条轮胎下方承受的重量。正确安排车辆周围的重量，对于针对特定赛道和条件优化车辆至关重要。单个车轮重量和横向配重通过弹簧座高偏移设置进行调整。 | 用于调整车高和车轮载荷。调整该设置会在静态条件下对弹簧施加预载。减小数值会增加弹簧预载，为该车轮增加重量并提高该处车高；增大数值则相反，会降低相应车轮的车高和重量。调整车高时，应成对调整（例如左、右两侧），或同时调整车辆上的四个弹簧预载，以避免改变横向配重。 |
      | 从地面到车身参考点的距离。由于这些数值是测量车辆上的特定参考点，因此不一定代表车辆的离地间隙，而是在静态条件下可靠地表示车辆离赛道的高度。调整车高是获得最佳性能的关键，因为它会直接影响车辆的空气动力学性能和机械抓地力。提高后部车高会增加总下压力并将空气动力学平衡向车头移动，但会增加阻力。降低后部车高则相反，空气动力学平衡向后移动，且总下压力和阻力都会降低。 | 弹簧刚度改变弹簧的硬度，以单位位移所需的力表示。弹簧主要负责在车轮载荷变化时维持车高和空气动力学姿态；较硬的弹簧能更好地维持车辆空气动力学平台，但会牺牲机械抓地力。较软的弹簧能更好地处理颠簸并提高机械抓地力，但会使车辆的空气动力学平台恶化。由于认证规则，后部弹簧刚度必须在后轴两侧对称，只能成对调整。 |
      | 减震器挠度是指在车库静态条件下，减震器相对于完全伸展长度压缩了多少。这有助于确定减震器在触发缓冲块之前还剩多少行程。 | 低速压缩阻尼影响减震器在相对低速运动时抵抗压缩（长度缩短）的程度，通常涉及由车手输入（转向、制动和油门）以及过弯载荷引起的车身运动。较高数值会增加压缩阻力，使载荷更快转移到相应轮胎，从而在施加油门时造成转向不足。 |
      
      #### 车高（RIDE HEIGHT）
      
      #### 弹簧刚度
      
      #### 减振器挠度
      
      #### 低速压缩阻尼
      
      #### 弹簧挠度
      
      弹簧挠度表示弹簧相对于未加载长度压缩了多少。该数值可用于观察静态条件下的弹簧预载，并与车辆其他车轮比较；数值越高表示相应弹簧的预载越大。
      
      #### 高速回弹阻尼（HS REBOUND DAMPING）
      
      | 高速压缩阻尼 | 数值 |
      | --- | --- |
      | 高速压缩阻尼影响减震器在高速行程中的表现，通常与驶过路肩和赛道路面颠簸有关。较高的压缩数值会使悬架在这些情况下更硬；较低数值则允许悬架更好地吸收颠簸，但可能损害车辆在赛道上的空气动力学平台。 | 高速回弹调节减震器在颠簸和路肩冲击中的伸展。较高数值会降低减震器伸长的速度，较低数值会让减震器更容易伸展。尽管高速回弹对车手输入产生的操控影响没有那么大，但如果设置不当，它在空气动力学控制和不受控振荡方面可能产生类似结果。 |
      | 压缩阻尼斜率设置控制减震器高速压缩侧的整体形状。较低斜率会产生更平坦、更渐进的曲线，较高数值则会产生更线性、更激进的压缩图线。斜率设置对于控制减震器高速运动时的颠簸吸收和空气动力学平台非常重要。较低斜率有助于在更颠簸的赛道上吸收颠簸和路肩等尖锐冲击；较高斜率则会让悬架保持更刚性。需要理解的是，这些设置会影响高速压缩的作用范围；斜率越高，高速压缩产生的整体力越大。 | 外倾角是车轮相对于车身中心的垂直角度。当车轮顶部比底部更靠近车身中心线时为负外倾角；当轮胎顶部比底部更向外时为正外倾角。由于悬架几何和弯道载荷，四个车轮都需要负外倾角。较大的负外倾角会增加轮胎产生的过弯力，但会减少轮胎在制动时可提供的纵向抓地力。过大的外倾角可能带来很高的过弯力，也会显著缩短轮胎寿命，因此需要在寿命与性能之间找到平衡。较大的后轮外倾角可以提高过弯稳定性，但会降低制动时的稳定性。 |
      | 低速回弹阻尼控制减震器在低速伸展时的刚度，通常发生在车手输入导致的车身运动过程中。较高的回弹数值会抵抗减震器伸长，较低数值会让减震器更快伸展。较高的回弹数值可以更好地控制空气动力学姿态，但当悬架无法充分伸展以保持与赛道的适当接触时，可能使车轮卸载。调校操控时，较高的后部低速回弹会增加松油门时的机械转向不足（但会减少车尾抬升），较低数值则会让后端抓地力维持更久，有助于减少转向过度，但会增加减速时的车尾抬升。后部回弹过高可能导致不必要的振荡，因为车轮会从赛道路面弹起而不是保持接触。 | 从上方观察，前束是车轮相对于车身中心线的角度。车轮前端比后端更靠近中心线时为前束，反之则为后束。在后部，增加前束会提高直线稳定性，但可能损害车辆改变方向的能力。 |
      
      #### 高速压缩阻尼斜率
      
      #### 外倾角（CAMBER）
      
      #### 低速回弹阻尼（LS REBOUND DAMPING）
      
      #### 前束（TOE-IN）

    bodyEn: |+
      ![Image](./assets/bmw-m-hybrid-v8/rear-corners.png)
      
      #### SPRING PERCH OFFSET
      
      | CORNER WEIGHT | Value |
      | --- | --- |
      | The weight underneath each tire under static conditions in the garage. Correct weight arrangement around the car is crucial for optimizing a car for a given track and conditions. Individual wheel weight adjustments and crossweight adjustments are made via the Spring Perch Offset setting. | Used to adjust ride height and corner weight, adjusting this setting applies a preload to the spring under static conditions. Decreasing the value increases preload on the spring, adding weight to its corner and increasing the ride height at that corner. Increasing the value does the opposite, reducing height and weight on a given corner. These should be adjusted in pairs (left and right, for example) or with all four spring preload adjustments in the car to prevent crossweight changes while adjusting ride height. |
      | Distance from ground to a reference point on the chassis. Since these values are measured to a specific reference point on the car, these values may not necessarily reflect the vehicle’s ground clearance, but instead provide a reliable value for the height of the car off of the race track at static values. Adjusting Ride Heights is key for optimum performance, as they can directly influence the vehicle’s aerodynamic performance as well as mechanical grip. Raising the rear ride height will increase overall downforce and shift aero to the front of the car but will increase drag. Decreasing rear ride height will do the opposite, with aero shifting rearward and overall downforce and drag decreasing. | Spring Rate changes how stiff the spring is, represented in a force per unit of displacement. Primarily responsible for maintaining ride height and aerodynamic attitude under changing wheel loads, stiffer springs will maintain the car’s aero platform better while sacrificing mechanical grip. Softer springs will deal with bumps better and increase mechanical grip, but will cause the car’s aerodynamic platform to suffer. Due to homologation rules, rear spring rates must be symmetrical across the rear axle and can only be changed in pairs. |
      | Shock Deflection is how much the shock has compressed from its fully extended length while under static conditions in the garage. This is useful for determining how much shock travel is available before a bump stop is engaged on the shock. | Low Speed Compression affects how resistant the shock is to compression (reduction in length) when the shock is moving at relatively low speeds, usually in chassis movements as a result of driver input (steering, braking, & throttle) and cornering forces. Higher values will increase compression resistance and transfer load onto a given tire under these low-speed conditions more quickly, inducing understeer on throttle application. |
      
      #### RIDE HEIGHT
      
      #### SPRING RATE
      
      #### SHOCK DEFLECTION
      
      #### LS COMP DAMPING
      
      #### SPRING DEFLECTION
      
      Spring Deflection shows how much the spring has compressed from its unloaded length. This can be used to see spring preload under static conditions and compare it against other corners of the car, with higher values representing more preload on a given spring.
      
      #### HS REBOUND DAMPING
      
      | HS COMP DAMPING | Value |
      | --- | --- |
      | High Speed Compression affects the shock’s behavior in high-speed travel, usually attributed to curb strikes and bumps in the track’s surface. Higher compression values will cause the suspension to be stiffer in these situations, while lower values will allow the suspension to absorb these bumps better but may hurt the aerodynamic platform around the track. | High-speed rebound adjusts the shock in extension over bumps and curb strikes. Higher values will reduce how quickly the shock will expand, while lower values will allow the shock to extend more easily. Despite not having as much of an effect on handling in response to driver inputs, High-speed rebound can produce similar results in terms of aerodynamic control and uncontrolled oscillations if set improperly. |
      | The Compression Damping Slope setting controls the overall shape of the high-speed compression side of the shock. Lower slope values produce a flatter, more digressive curve while higher values result in a more linear and aggressive compression graph. The value of the slope setting is very important in controlling bump absorption at high shock velocities and controlling the aerodynamic platform. A lower slope will be helpful for rougher tracks in absorbing bumps and sharp impacts such as curbs, while a higher slope will keep the suspension more rigid. It’s important to understand that these settings will affect the range the High-Speed Compression will have, with higher slope values producing a higher overall force for high-speed compression. | Camber is the vertical angle of the wheel relative to the center of the chassis. Negative camber is when the top of the wheel is closer to the chassis centerline than the bottom of the wheel, positive camber is when the top of the tire is farther out than the bottom. Due to suspension geometry and corner loads, negative camber is desired on all four wheels. Higher negative camber values will increase the cornering force generated by the tire, but will reduce the amount of grip the tire will have under braking. Excessive camber values can produce very high cornering forces but will also significantly reduce tire life, so it is important to find a balance between life and performance. Higher rear camber values can increase cornering stability but reduce stability under braking. |
      | Low-speed Rebound damping controls the stiffness of the shock while extending at lower speeds, typically during body movement as a result of driver inputs. Higher rebound values will resist expansion of the shock, lower values will allow the shock to extend faster. Higher rebound values can better control aerodynamic attitude but can result in the wheel being unloaded when the suspension can’t expand enough to maintain proper contact with the track. When tuning for handling, higher rear low-speed rebound can increase off-throttle mechanical understeer (but reduce rear-end lift) while lower values will maintain rear end grip longer, helping to reduce oversteer, but will allow more rear end lift under deceleration. Excessive rear rebound can lead to unwanted oscillations due to the wheel bouncing off of the track surface instead of staying in contact. | Toe is the angle of the wheel, when viewed from above, relative to the centerline of the chassis. Toe-in is when the front of the wheel is closer to the centerline than the rear of the wheel, and Toe-out is the opposite. On the rear end, adding toe-in will increase straight-line stability but may hurt how well the car changes direction. |
      
      #### HS COMP DAMPING SLOPE
      
      #### CAMBER
      
      #### LS REBOUND DAMPING
      
      #### TOE-IN

  - id: rear
    level: 3
    titleZh: 后部
    titleEn: REAR
    bodyZh: |+
      ![图示](./assets/bmw-m-hybrid-v8/rear-chassis.png)
      
      | 第三弹簧 | 数值 |
      | --- | --- |
      | 第三弹簧与前部 Heave 弹簧类似，是一种只对垂向悬架运动提供阻力、不影响侧倾刚度的弹簧元件。该弹簧元件有助于控制不断增加的空气动力学载荷，并在整个赛道上维持正确的空气动力学姿态。后端第三弹簧对于维持和控制整圈的后部车高、最大化后部车身产生的下压力至关重要。 | 防倾杆（ARB）尺寸会改变后悬架的侧倾刚度。增大防倾杆尺寸会提高后悬架侧倾刚度，减少车身侧倾，但增加机械转向过度。相反，减小防倾杆尺寸会使悬架侧倾方向变软，增加车身侧倾但减少机械转向过度；这可能使转向感觉响应变慢，但后轴整体抓地力会增加。 |
      | 第三弹簧座高偏移用于调整后部第三弹簧的预载。这是通过后部第三弹簧元件调整车高的两种方法之一：较低数值会使弹簧预载更大、抬高后部车高；相反，较高数值会释放弹簧载荷、降低后部车高。 | 可以改变防倾杆臂或“叶片”的配置，以调整防倾杆总成的整体刚度。较高数值会让更多力通过臂传递到防倾杆本体，提高后悬架侧倾刚度，并产生与增大防倾杆直径相同但程度较小的效果。相反，较低数值会降低后悬架侧倾刚度，产生与减小防倾杆直径相同的效果。这些叶片调整可以看作防倾杆直径设置之间的微调。 |
      
      #### 第三滑块挠度
      
      滑块挠度表示第三弹簧所安装的滑块机构从完全伸展状态压缩了多远。它类似减震器，但不会产生任何阻尼力，因此不会影响悬架行为。
      
      #### 防倾杆尺寸（ARB SIZE）
      
      #### 防倾杆刀片（ARB BLADES）
      
      #### 第三弹簧座高偏移
      
      #### 第三弹簧挠度
      
      第三弹簧挠度表示后部第三弹簧在静态条件下被压缩的量。该数值不能直接调整，但会随第三弹簧座高偏移和后部弹簧设置的调整而变化。

    bodyEn: |+
      ![Image](./assets/bmw-m-hybrid-v8/rear-chassis.png)
      
      | THIRD SPRING | Value |
      | --- | --- |
      | The Third Spring, similar to the front Heave Spring, is a spring element configured to provide resistance only in vertical suspension movement without affecting roll stiffness. This spring element is helpful with controlling increasing aerodynamic loads and maintaining the proper aerodynamic attitude around a circuit. The rear end’s third spring is crucial in maintaining and controlling the rear ride height around a circuit to maximize the downforce produced by the rear bodywork. | The ARB (Anti-Roll Bar) size alters the stiffness of the rear suspension in roll. Increasing the ARB size will increase the roll stiffness of the rear suspension, resulting in less body roll but increasing mechanical oversteer. Conversely, reducing the ARB size will soften the suspension in roll, increasing body roll but decreasing mechanical oversteer. This can result in a less-responsive feel from the steering, but grip across the rear axle will increase. |
      | The Third Perch Offset is used to adjust preload on the rear Third Spring. This is one of two methods to adjust ride height through the rear Third Spring element, with lower values preloading the spring more and raising front ride heights. Conversely, higher values will unload the spring and lower front ride heights. | The configuration of the Anti-Roll Bar arms, or “blades”, can be changed to alter the overall stiffness of the ARB assembly. Higher values transfer more force through the arms to the ARB itself, increasing roll stiffness in the rear suspension and producing the same effects, albeit on a smaller scale, as increasing the diameter of the Anti-roll bar. Conversely, lower values reduce the roll stiffness of the rear suspension and produce the same effects as decreasing the diameter of the Anti-roll bar. These blade adjustments can be thought of as fine-tuning adjustments between Anti-roll bar diameter settings. |
      
      #### THIRD SLIDER DEFLECTION
      
      The Slider Deflection is how far the slider mechanism the Third Spring is mounted on has compressed from fully extended. Similar to a shock but without any damping forces produced, this doesn’t influence the suspension’s behavior.
      
      #### ARB SIZE
      
      #### ARB BLADES
      
      #### THIRD PERCH OFFSET
      
      #### THIRD SPRING DEFLECTION
      
      Third Spring Deflection represents the amount the rear Third Spring is compressed under static conditions. This is not directly adjustable but will change with adjustments to the Third Perch Offset and rear Spring settings.

  - id: brakes-drive-unit
    level: 2
    titleZh: 制动 / 驱动单元
    titleEn: BRAKES/DRIVE UNIT
  - id: lighting-and-brake-spec
    level: 3
    titleZh: 照明与制动规格
    titleEn: LIGHTING & BRAKE SPEC
    bodyZh: |+
      ![图示](./assets/bmw-m-hybrid-v8/lighting-brake-spec.png)
      
      #### 车顶识别灯颜色（ROOF ID LIGHT COLOR）
      
      可以改变车顶识别灯的颜色，以便在夜间条件下更好地区分涂装相似的车辆。该调整不会影响车辆性能。
      
      #### 刹车片复合材料（PAD COMPOUND）
      
      可以通过刹车片复合材料改变车辆的制动性能。“Low”设置提供最小摩擦力，降低制动效果，但能更好地调节制动压力；“Medium”和“High”提供更多摩擦力并提高制动效果，同时增加制动锁死的风险。
      
      #### 前主缸（FRONT MASTER CYLINDER）
      
      改变前制动主缸尺寸可以调整前制动卡钳的管路压力。较大的主缸会降低前制动管路压力，使制动力分配向后移动，并增加锁死前轮所需的踏板力；较小的主缸会提高前制动管路压力，使制动力分配向前移动，并减少锁死前轮所需的踏板力。
      
      #### 后主缸（REAR MASTER CYLINDER）
      
      改变后制动主缸尺寸可以调整后制动卡钳的管路压力。较大的主缸会降低后制动管路压力，使制动力分配向前移动，并增加锁死后轮所需的踏板力；较小的主缸会提高后制动管路压力，使制动力分配向后移动，并减少锁死后轮所需的踏板力。
      
      #### 制动压力分配（BRAKE PRESSURE BIAS）
      
      制动力分配是传递至前制动器的制动力百分比。高于 50% 的数值会将更多压力传向前制动器，低于 50% 的数值则会将更多制动力传向后制动器。应根据车手偏好和赛道条件进行调校，以获得特定情况下的最佳制动性能。

    bodyEn: |+
      ![Image](./assets/bmw-m-hybrid-v8/lighting-brake-spec.png)
      
      #### ROOF ID LIGHT COLOR
      
      The color of the identifier lights on the roof of the car can be changed to better identify similarly-painted cars in nighttime conditions. This adjustment has no effect on vehicle performance.
      
      #### PAD COMPOUND
      
      The vehicle’s braking performance can be altered via the Brake Pad Compound. The “Low” setting provides the least friction, reducing the effectiveness of the brakes but allowing for better brake pressure modulation, while “Medium” and “High” provide more friction and increase the effectiveness of the brakes while increasing the risk of a brake lockup.
      
      #### FRONT MASTER CYLINDER
      
      The Front Brake Master Cylinder size can be changed to alter the line pressure to the front brake calipers. A larger master cylinder will reduce the line pressure to the front brakes, which will shift the brake bias rearwards and increase the pedal effort required to lock the front wheels. A smaller master cylinder will increase brake line pressure to the front brakes, shifting brake bias forward and reducing required pedal effort to lock the front wheels.
      
      #### REAR MASTER CYLINDER
      
      The Rear Brake Master Cylinder size can be changed to alter the line pressure to the rear brake calipers. A larger master cylinder will reduce the line pressure to the rear brakes, which will shift the brake bias forwards and increase the pedal effort required to lock the rear wheels. A smaller master cylinder will increase brake line pressure to the rear brakes, shifting brake bias rearward and reducing required pedal effort to lock the rear wheels.
      
      #### BRAKE PRESSURE BIAS
      
      Brake Bias is the percentage of braking force that is being sent to the front brakes. Values above 50% result in more pressure being sent to the front, while values less than 50% send more force to the rear. This should be tuned for both driver preference and track conditions to get the optimum braking performance for a given situation.

  - id: hybrid-config-and-fuel
    level: 3
    titleZh: 混合动力配置与燃油
    titleEn: HYBRID CONFIG & FUEL
    bodyZh: |+
      ![图示](./assets/bmw-m-hybrid-v8/hybrid-fuel.png)
      
      BMW M Hybrid V8 的混合动力系统可以设置为五种模式之一，以改变每圈结束时电池荷电状态（SoC）的目标。每种模式都会在一圈中使用不同程度的能量来达到目标，因此有些模式会在电池放电的代价下，在一圈中产生更多功率并带来更快圈速。
      
      #### 平衡（BALANCED）
      
      | 不释放（NO DEPLOY） | 数值 |
      | --- | --- |
      | 在“No Deploy”模式下，混合动力系统不会使用电池中储存的能量。这实际上会禁用混合动力驱动系统，只在一圈行驶过程中为电池充电。该模式仅在排位赛和测试赛中可用，用于在切换到 Qual 模式前将电池充满。 | Balanced 模式是混合动力系统的主要比赛模式。它会尝试释放电能，尽可能缩短圈速，同时在一圈内维持合理的荷电状态。会话开始时，混合动力系统需要几圈飞驰圈来学习赛道，并优化释放策略以获得最佳圈速；该模式仅在练习、比赛和测试赛中可用。 |
      | 该模式用于排位赛中的飞驰圈，并会尝试在一圈内使用全部电池电量。该模式仅在排位赛和测试赛中可用；在外圈和暖胎圈应先使用 No Deploy 设置，以确保电池充满后再切换到 Qual 模式。 | 当电池电量较低，或需要在切换到 Attack 模式前补充电量时，Build 模式会尝试尽快建立电池电量。请注意，与 Balanced 相比，该模式会显著牺牲圈速；电池充电完成后应切回 Balanced，以免损失已回收的能量并避免不必要的速度损失。该模式仅在练习、比赛和测试赛中可用。 |
      | Attack 模式会降低荷电状态目标，在比赛中使用更多功率以帮助超车。通常，该模式带来的圈速收益不足以抵消使用 Attack 模式后重新充电和恢复电量造成的速度损失，因此只有在完成超车确有必要时才应使用。由于最后一圈之后不再需要电池，该模式也可用于最后一圈的速度爆发。该模式仅在练习、比赛和测试赛中可用。 | 燃油量是车辆驶离车库时油箱中的燃油量。 |
      
      #### 排位（QUAL）
      
      #### 建立电量（BUILD）
      
      #### 攻击（ATTACK）
      
      #### 燃油量（FUEL LEVEL）

    bodyEn: |+
      ![Image](./assets/bmw-m-hybrid-v8/hybrid-fuel.png)
      
      The Hybrid power system on the BMW LMDh can be set to one of five modes to change the target battery State of Charge (SoC) after each lap. Each of these modes will use varying levels of energy throughout a lap to reach a target, and thus some will produce more power over the course of a lap and faster lap times at the cost of discharging the battery.
      
      #### BALANCED
      
      | NO DEPLOY | Value |
      | --- | --- |
      | In the “No Deploy” mode, the Hybrid system will not use any energy stored in the battery. This essentially disables the Hybrid drive system and will only charge the battery throughout a lap. This is only available in Qualifying and Test sessions and is used to fully charge the battery before switching to Qual mode. | The Balanced mode is the primary Race mode for the Hybrid system. This mode will attempt to deploy electrical charge to reduce lap times as much as possible while still maintaining a reasonable State of Charge over the duration of a lap. At the start of a session, it will take a few flying laps for the Hybrid system to learn the track and optimize deployment for the best lap times, and this mode is only available in Practice, Race, and Test sessions. |
      | This mode is intended to be used on flying laps during qualifying sessions and will attempt to use all of the battery charge during a lap. This is only available during Qualifying and Test sessions and should be preceded by the No Deploy setting on outlaps and warmup laps to ensure the battery is fully charged before switching to the Qual mode. | The Build mode will attempt to build battery charge as quickly as possible in the event of a low battery charge or if it is needed prior to switching to Attack mode. Note that this will compromise lap times significantly compared to Balanced, and it’s important to switch back to Balanced mode once the battery has charged to avoid losing harvested energy and to prevent unnecessary loss in pace. This mode is only available in Practice, Race, and Test sessions. |
      | Attack mode reduces the target State of Charge to use more power during race sessions to help with overtaking. Generally the laptime gain from this mode is not enough to offset the loss in pace from having to recharge and recover from using Attack mode, so it should be used only when it is absolutely necessary to complete an overtake. This mode can also be used on the final lap for a burst of speed since the battery is no longer needed. This mode is only available for Practice, Race, and Test sessions. | Fuel level is the amount of fuel in the fuel tank when the car leaves the garage. |
      
      #### QUAL
      
      #### BUILD
      
      #### ATTACK
      
      #### FUEL LEVEL

  - id: traction-control-gear-ratios-and-rear-diff-spec
    level: 3
    titleZh: 牵引力控制、齿比与后差速器规格
    titleEn: TRACTION CONTROL, GEAR RATIOS, & REAR DIFF SPEC
    bodyZh: |+
      ![图示](./assets/bmw-m-hybrid-v8/traction-gears-differential.png)
      
      #### 牵引力控制增益（TRACTION CONTROL GAIN）
      
      增益是检测到车轮打滑时牵引力控制系统施加的介入程度。数值越高，为控制车轮空转而进行的油门切断越激进。
      
      #### 牵引力控制滑移（TRACTION CONTROL SLIP）
      
      滑移表示牵引力控制系统对车轮空转的敏感程度。数值越高，较小程度的车轮空转就会激活牵引力控制系统；数值越低，系统会允许更多车轮空转后才介入。
      
      #### 齿轮组（GEAR STACK）
      
      齿轮组会改变变速箱的齿比。有两种选择：Short（短）和 Long（长）。Short 设置会选择更偏重加速的齿轮组，适合直道较短或弯道较慢的赛道；Long 选项会选择更适合高速赛道和长直道的挡位。
      
      #### 齿速（GEAR SPEEDS）
      
      变速箱的七个前进挡都会显示发动机达到最大转速时的大致地面速度。这些数值会根据选择的齿轮组而变化，但由于赛道上的实际条件，真实最高速度可能略有不同。
      
      #### 滑行 / 驱动斜坡角
      
      滑行斜坡角和驱动斜坡角会影响差速器在加速时使两个驱动轮保持锁定所施加的力。较低数值会产生更大的锁止力，而更大的锁止力会增加制动和加速阶段的转向不足。较高数值会产生更小的锁止力，并在这些情况下导致转向过度。
      
      #### 离合器摩擦片（CLUTCH FRICTION PLATES）
      
      离合器片的数量会影响保持差速器锁止所施加的总力。将其视为乘数，增加片数会产生越来越大的锁止力。
      
      #### 预载（PRELOAD）
      
      可以为差速器设置静态载荷。数值越高，差速器在所有条件下产生的锁止力越大，从而在加速和减速时带来更多转向不足。该数值也会影响弯心表现；数值越高，差速器越不容易解锁，弯心转向不足越明显。

    bodyEn: |+
      ![Image](./assets/bmw-m-hybrid-v8/traction-gears-differential.png)
      
      #### TRACTION CONTROL GAIN
      
      Gain is the amount of intervention the Traction Control will exert when wheel spin is detected. Higher values result in a more aggressive throttle cut to control wheelspin.
      
      #### TRACTION CONTROL SLIP
      
      Slip is how sensitive the Traction Control system will be to wheelspin. Higher values will activate the Traction Control system with smaller amounts of wheelspin, while lower values will allow slightly more wheelspin prior to activating the system.
      
      #### GEAR STACK
      
      Gear Stack changes the gear ratios in the transmission. Two choices are available: Short and Long. The Short setting will choose a more acceleration-focused gear set for tracks with shorter straights or slower corners, while the Long option will choose gears more suited to high-speed tracks with long straights.
      
      #### GEAR SPEEDS
      
      Each of the transmission’s seven forward gears will show the approximate ground speed at which the engine will reach maximum RPM. These values will change based on which Gear Stack is selected, but the true maximum speed may differ slightly due to on-track conditions.
      
      #### COAST/DRIVE RAMP ANGLES
      
      Coast and Drive Ramp Angles affect the force exerted by the differential to keep both driven tires locked together under acceleration. Lower values produce more locking force, and more locking force increases understeer during braking and acceleration phases. Higher values will produce less locking force and induce oversteer in these situations.
      
      #### CLUTCH FRICTION PLATES
      
      The number of clutch faces affect how much overall force is applied to keep the differential locked. Treated as a multiplier, adding more faces produces increasingly more locking force.
      
      #### PRELOAD
      
      The differential can be set with a static load applied. Higher values produce more locking force in the differential in all conditions, producing more understeer under acceleration and deceleration. This value will also affect mid-corner performance, with higher values not allowing the differential to unlock as much, increasing mid-corner understeer.

  - id: setup-tips
    level: 2
    titleZh: 设置技巧
    titleEn: SETUP TIPS
    bodyZh: |+
      > 本节旨在帮助希望深入了解车辆各项设置的用户。

