    titleEn: CHASSIS
  - id: front
    level: 3
    titleZh: 前部
    titleEn: FRONT
    bodyZh: |+
      ![图示](./assets/bmw-m-hybrid-v8/front-chassis.png)
      
      #### 垂向弹簧（HEAVE SPRING）
      
      前部 Heave 弹簧是处理纯垂向外部载荷的悬架元件，不会控制转弯时会导致车身侧倾的载荷。这些载荷通常来自高速时不断增加的下压力、赛道上的凹陷和隆起，或重刹车。较高的刚度值会使悬架在 Heave 方向变硬，有助于控制车高、维持良好的空气动力学平台，但在颠簸路面可能产生弹跳。较低的刚度更容易吸收颠簸和载荷，但过度的车身运动会损害空气动力学平台。
      
      #### 垂向弹簧座偏移（HEAVE PERCH OFFSET）
      
      Heave 座高偏移用于调整 Heave 弹簧的预载。这是通过前部 Heave 元件调整车高的两种方法之一：较低数值会使弹簧预载更大、抬高前部车高；相反，较高数值会释放弹簧载荷、降低前部车高。
      
      #### 垂向弹簧挠度（HEAVE SPRING DEFLECTION）
      
      Heave 弹簧挠度表示静态条件下 Heave 弹簧被压缩的量。该数值不能直接调整，但会随 Heave 座高偏移和前部扭杆设置的调整而变化。
      
      #### 升沉滑块挠度
      
      滑块挠度表示 Heave 弹簧所安装的滑块机构从完全伸展状态压缩了多远。它类似减震器，但不会产生任何阻尼力，因此不会影响悬架行为。
      
      #### 防倾杆尺寸（ARB SIZE）
      
      防倾杆（ARB）尺寸会改变前悬架的侧倾刚度。增大防倾杆尺寸会提高前悬架侧倾刚度，减少车身侧倾，但增加机械转向不足。在某些情况下，这也会让车手感觉转向响应更快。相反，减小防倾杆尺寸会使悬架侧倾方向变软，增加车身侧倾但减少机械转向不足；这可能使转向感觉响应变慢，但前轴整体抓地力会增加。
      
      #### 防倾杆刀片（ARB BLADES）
      
      可以改变防倾杆臂或“叶片”的配置，以调整防倾杆总成的整体刚度。较高数值会让更多力通过臂传递到防倾杆本体，提高前悬架侧倾刚度，并产生与增大防倾杆直径相同但程度较小的效果。相反，较低数值会降低前悬架侧倾刚度，产生与减小防倾杆直径相同的效果。这些叶片调整可以看作防倾杆直径设置之间的微调。
      
      #### 前束（TOE-IN）
      
      从上方观察时，前束角是车轮相对于底盘中心线的夹角。车轮前缘比后缘更靠近中心线称为正前束，车轮前缘比后缘更远离中心线则称为负前束。在前轴，前束会改变轮胎对转向输入的响应速度，并影响车辆的直线稳定性。负前束设置（车库中显示为负值）会提高初始转向响应，但降低直线稳定性；正前束（车库中显示为正值）会提高直线稳定性，但使初始转向响应变得迟缓。
      
      #### 推杆长度偏移
      
      该设置会同时调整两根前悬架推杆的长度，以相对于基准长度的偏移量显示。这是调整前部车高的好方法，无须改变 Heave 弹簧或任一前部扭杆的预载。

    bodyEn: |+
      ![Image](./assets/bmw-m-hybrid-v8/front-chassis.png)
      
      #### HEAVE SPRING
      
      The front Heave Spring is a suspension element that handles external loads from purely vertical loads and doesn’t control loads that would induce chassis roll when cornering. Generally these loads are present for increasing downforce loads at higher speeds, dips and crests in the track, or under heavy braking. Higher rate values will stiffen the suspension in heave, which is good for controlling ride heights to maintain a good aerodynamic platform, but can produce a bouncing effect on rough surfaces. Lower rates will absorb bumps and loads easier, but will hurt the aerodynamic platform due to excessive chassis movement.
      
      #### HEAVE PERCH OFFSET
      
      The Heave Perch Offset is used to adjust preload on the Heave Spring. This is one of two methods to adjust ride height through the front Heave element, with lower values preloading the spring more and raising front ride heights. Conversely, higher values will unload the spring and lower front ride heights.
      
      #### HEAVE SPRING DEFLECTION
      
      Heave Spring Deflection represents the amount the Heave Spring is compressed under static conditions. This is not directly adjustable but will change with adjustments to the Heave Perch Offset and front Torsion Bar settings.
      
      #### HEAVE SLIDER DEFLECTION
      
      The Slider Deflection is how far the slider mechanism the Heave Spring is mounted on has compressed from fully extended. Similar to a shock but without any damping forces produced, this doesn’t influence the suspension’s behavior.
      
      #### ARB SIZE
      
      The ARB (Anti-Roll Bar) size alters the stiffness of the front suspension in roll. Increasing the ARB size will increase the roll stiffness of the front suspension, resulting in less body roll but increasing mechanical understeer. This can also, in some cases, lead to a more responsive steering feel from the driver. Conversely, reducing the ARB size will soften the suspension in roll, increasing body roll but decreasing mechanical understeer. This can result in a less-responsive feel from the steering, but grip across the front axle will increase.
      
      #### ARB BLADES
      
      The configuration of the Anti-Roll Bar arms, or “blades”, can be changed to alter the overall stiffness of the ARB assembly. Higher values transfer more force through the arms to the ARB itself, increasing roll stiffness in the front suspension and producing the same effects, albeit on a smaller scale, as increasing the diameter of the sway bar. Conversely, lower values reduce the roll stiffness of the front suspension and produce the same effects as decreasing the diameter of the sway bar. These blade adjustments can be thought of as fine-tuning adjustments between sway bar diameter settings.
      
      #### TOE-IN
      
      Toe is the angle of the wheel, looking from vertical, relative to the chassis centerline. Toe-in is when the front of the wheels are closer to the centerline while Toe-out is when the front of the wheels are farther from the centerline than the rear of the tires. On the front end, Toe will alter how quickly the tires respond to steering inputs and influence how stable the car is in a straight line. Toe-out settings (negative garage value) will increase turn-in response and make the car less stable in a straight line, while Toe-in (positive garage value) will increase straight-line stability while making initial steering response more sluggish.
      
      #### PUSHROD LENGTH OFFSET
      
      This adjusts the length of both front suspension pushrods together, shown as an offset from a baseline length figure. This is a great way to adjust front ride height without altering the preload on the Heave Spring or either front Torsion Bars.

  - id: front-corners
    level: 3
    titleZh: 前轮角
    titleEn: FRONT CORNERS
    bodyZh: |+
      ![图示](./assets/bmw-m-hybrid-v8/front-corners.png)
      
      #### 扭杆圈数（TORSION BAR TURNS）
      
      | 角重（CORNER WEIGHT） | 数值 |
      | --- | --- |
      | 车库静态条件下每条轮胎下方承受的重量。正确安排车辆周围的重量，对于针对特定赛道和条件优化车辆至关重要。单个车轮重量和横向配重通过前部扭杆圈数设置进行调整。 | 用于调整车高和车轮载荷。调整该设置会在静态条件下对扭杆施加预载。减小数值会增加扭杆预载，为该车轮增加重量并提高该处车高；增大数值则相反，会降低相应车轮的车高和重量。调整车高时，应成对调整（例如左、右两侧），或同时调整车辆上的四个弹簧预载，以避免改变横向配重。 |
      | 从地面到车身参考点的距离。由于这些数值是测量车辆上的特定参考点，因此不一定代表车辆的离地间隙，而是在静态条件下可靠地表示车辆离赛道的高度。调整车高是获得最佳性能的关键，因为它会直接影响车辆的空气动力学性能和机械抓地力。提高前部车高会降低总下压力并将空气动力学平衡向后移动，同时略微降低阻力。相反，降低前部车高会增加下压力并将空气动力学平衡向前移动，同时略微增加总阻力。 | 与防倾杆类似，扭杆是一种通过悬架行程产生的施加扭矩来提供抵抗力的弹簧。不过，这些扭杆的一端固定在车身上，因此只抵抗单个车轮的运动，其方式与螺旋弹簧抵抗运动和载荷变化相同。增大扭杆直径会提高弹簧刚度，减小直径则会降低弹簧刚度。刚性更高的弹簧非常适合平整赛道以及需要高度控制空气动力学姿态的场合，但刚性弹簧会显著降低机械抓地力，尤其是在颠簸路面。对于低抓地力和/或颠簸赛道，以及空气动力学效果可能不明显的低速赛道，较软的弹簧会牺牲空气动力学控制，却能提高机械抓地力。扭杆直径调整应与车高调整配合进行，以避免车辆在赛道上意外触底。 |
      
      #### 扭杆挠度（TORSION BAR DEFLECTION）
      
      扭杆挠度表示前部扭杆弹簧在静态条件下被预加载了多少。挠度值越高表示弹簧预载越大，数值越低表示弹簧预载越小。
      
      #### 低速压缩阻尼
      
      低速压缩阻尼影响减震器在相对低速运动时抵抗压缩（长度缩短）的程度，通常涉及由车手输入（转向、制动和油门）以及过弯载荷引起的车身运动。较高数值会增加压缩阻力，使载荷更快转移到相应轮胎，从而造成转向不足。应用于前部减震器时，较低数值会减缓重量向轮胎的转移，减少转向不足。
      
      #### 车高（RIDE HEIGHT）
      
      #### 扭杆外径（TORSION BAR O.D.）
      
      #### 减振器挠度
      
      减震器挠度是指在车库静态条件下，减震器相对于完全伸展长度压缩了多少。这有助于确定减震器在触发缓冲块之前还剩多少行程。
      
      #### 高速回弹阻尼（HS REBOUND DAMPING）
      
      | 高速压缩阻尼 | 数值 |
      | --- | --- |
      | 高速压缩阻尼影响减震器在高速行程中的表现，通常与驶过路肩和赛道路面颠簸有关。较高的压缩数值会使悬架在这些情况下更硬；较低数值则允许悬架更好地吸收颠簸，但可能损害车辆在赛道上的空气动力学平台。 | 高速回弹调节减震器在颠簸和路肩冲击中的伸展。较高数值会降低减震器伸长的速度，较低数值会让减震器更容易伸展。尽管高速回弹对车手输入产生的操控影响没有那么大，但如果设置不当，它在空气动力学控制和不受控振荡方面可能产生类似结果。 |
      | 压缩阻尼斜率设置控制减震器高速压缩侧的整体形状。较低斜率会产生更平坦、更渐进的曲线，较高数值则会产生更线性、更激进的压缩图线。斜率设置对于控制减震器高速运动时的颠簸吸收和空气动力学平台非常重要。较低斜率有助于在更颠簸的赛道上吸收颠簸和路肩等尖锐冲击；较高斜率则会让悬架保持更刚性。需要理解的是，这些设置会影响高速压缩的作用范围；斜率越高，高速压缩产生的整体力越大。 | 外倾角是车轮相对于车身中心的垂直角度。当车轮顶部比底部更靠近车身中心线时为负外倾角；当轮胎顶部比底部更向外时为正外倾角。由于悬架几何和弯道载荷，四个车轮都需要负外倾角。较大的负外倾角会增加轮胎产生的过弯力，但会减少轮胎在制动时可提供的纵向抓地力。过大的外倾角可能带来很高的过弯力，也会显著缩短轮胎寿命，因此需要在寿命与性能之间找到平衡。 |
      
      #### 低速回弹阻尼（LS REBOUND DAMPING）
      
      低速回弹阻尼控制减震器在低速伸展时的刚度，通常发生在车手输入导致的车身运动过程中。较高的回弹数值会抵抗减震器伸长，较低数值会让减震器更快伸展。较高的回弹数值可以更好地控制空气动力学姿态，但当悬架无法充分伸展以保持与赛道的适当接触时，可能使车轮卸载。调校操控时，较高的前部低速回弹会增加油门开启时的机械转向不足（但会减少前翼片抬升），较低数值则会让前端抓地力维持更久，有助于减少转向不足，但会增加前翼片抬升。前部回弹过高可能导致不必要的振荡，因为车轮会从赛道路面弹起而不是保持接触。
      
      #### 高速压缩阻尼斜率
      
      #### 外倾角（CAMBER）

    bodyEn: |+
      ![Image](./assets/bmw-m-hybrid-v8/front-corners.png)
      
      #### TORSION BAR TURNS
      
      | CORNER WEIGHT | Value |
      | --- | --- |
      | The weight underneath each tire under static conditions in the garage. Correct weight arrangement around the car is crucial for optimizing a car for a given track and conditions. Individual wheel weight adjustments and crossweight adjustments are made via the Torsion Bar Turns setting on the front corners and the Spring Perch Offset on the rear corners. | Used to adjust ride height and corner weight, adjusting this setting applies a preload to the torsion bar under static conditions. Decreasing the value increases preload on the torsion bar, adding weight to its corner and increasing the ride height at that corner. Increasing the value does the opposite, reducing height and weight on a given corner. These should be adjusted in pairs (left and right, for example) or with all four spring preload adjustments in the car to prevent crossweight changes while adjusting ride height. |
      | Distance from ground to a reference point on the chassis. Since these values are measured to a specific reference point on the car, these values may not necessarily reflect the vehicle’s ground clearance, but instead provide a reliable value for the height of the car off of the race track at static values. Adjusting Ride Heights is key for optimum performance, as they can directly influence the vehicle’s aerodynamic performance as well as mechanical grip. Increasing the front ride height will decrease overall downforce and shift the aerodynamic balance rearward, but will decrease drag slightly. Conversely, reducing front ride height will increase downforce and shift aero balance forward while slightly increasing overall drag. | Similar to an Anti-Roll Bar, a torsion bar is a spring that exerts resistive forces via applied torque generated through suspension travel. However, these torsion bars are fixed to the chassis at one end, and thus resist movement only on one wheel in the same way a coil spring resists movement and load changes. Increasing the torsion bar’s diameter gives a higher spring rate, and reducing the diameter gives a lower spring rate. Stiffer springs are very helpful for smooth tracks and applications where a high level of aerodynamic attitude control is required, however stiff springs reduce mechanical grip significantly, especially over bumps. On low-grip and/or bumpy tracks, as well as lower speed tracks where aerodynamics may not be as effective, softer springs will increase mechanical grip while sacrificing aerodynamic control. Torsion Bar Diameter adjustments should be made in conjunction with ride height adjustments to prevent unwanted grounding of the chassis while on track. |
      
      #### TORSION BAR DEFLECTION
      
      The Torsion Bar Deflection is a representation of how much the front torsion bar springs have been preloaded under static conditions. Higher deflection values show higher amounts of spring preload, lower values represent less spring preload.
      
      #### LS COMP DAMPING
      
      Low Speed Compression affects how resistant the shock is to compression (reduction in length) when the shock is moving at relatively low speeds, usually in chassis movements as a result of driver input (steering, braking, & throttle) and cornering forces. Higher values will increase compression resistance and transfer load onto a given tire under these low-speed conditions more quickly, inducing understeer. Lower values will slow weight transfer to a tire, reducing understeer when applied to the front shocks.
      
      #### RIDE HEIGHT
      
      #### TORSION BAR O.D.
      
      #### SHOCK DEFLECTION
      
      Shock Deflection is how much the shock has compressed from its fully extended length while under static conditions in the garage. This is useful for determining how much shock travel is available before a bump stop is engaged on the shock.
      
      #### HS REBOUND DAMPING
      
      | HS COMP DAMPING | Value |
      | --- | --- |
      | High Speed Compression affects the shock’s behavior in high-speed travel, usually attributed to curb strikes and bumps in the track’s surface. Higher compression values will cause the suspension to be stiffer in these situations, while lower values will allow the suspension to absorb these bumps better but may hurt the aerodynamic platform around the track. | High-speed rebound adjusts the shock in extension over bumps and curb strikes. Higher values will reduce how quickly the shock will expand, while lower values will allow the shock to extend more easily. Despite not having as much of an effect on handling in response to driver inputs, High-speed rebound can produce similar results in terms of aerodynamic control and uncontrolled oscillations if set improperly. |
      | The Compression Damping Slope setting controls the overall shape of the high-speed compression side of the shock. Lower slope values produce a flatter, more digressive curve while higher values result in a more linear and aggressive compression graph. The value of the slope setting is very important in controlling bump absorption at high shock velocities and controlling the aerodynamic platform. A lower slope will be helpful for rougher tracks in absorbing bumps and sharp impacts such as curbs, while a higher slope will keep the suspension more rigid. It’s important to understand that these settings will affect the range the High-Speed Compression will have, with higher slope values producing a higher overall force for high-speed compression. | Camber is the vertical angle of the wheel relative to the center of the chassis. Negative camber is when the top of the wheel is closer to the chassis centerline than the bottom of the wheel, positive camber is when the top of the tire is farther out than the bottom. Due to suspension geometry and corner loads, negative camber is desired on all four wheels. Higher negative camber values will increase the cornering force generated by the tire, but will reduce the amount of longitudinal grip the tire will have under braking. Excessive camber values can produce very high cornering forces but will also significantly reduce tire life, so it is important to find a balance between life and performance. |
      
      #### LS REBOUND DAMPING
      
      Low-speed Rebound damping controls the stiffness of the shock while extending at lower speeds, typically during body movement as a result of driver inputs. Higher rebound values will resist expansion of the shock, lower values will allow the shock to extend faster. Higher rebound values can better control aerodynamic attitude but can result in the wheel being unloaded when the suspension can’t expand enough to maintain proper contact with the track. When tuning for handling, higher front low-speed rebound can increase on-throttle mechanical understeer (but reduce splitter lift) while lower values will maintain front end grip longer, helping to reduce understeer, but will allow more splitter lift. Excessive front rebound can lead to unwanted oscillations due to the wheel bouncing off of the track surface instead of staying in contact.
      
      #### HS COMP DAMPING SLOPE
      
      #### CAMBER

