  - id: setup-tips-2
    level: 2
    titleZh: 设置技巧
    titleEn: SETUP TIPS
  - id: provided-setups
    level: 3
    titleZh: 随附设置
    titleEn: PROVIDED SETUPS
    bodyZh: |+
      BMW M Hybrid V8 随附 12 个 iRacing 设置：
      
      #### 基准
      
      比高下压力设置略稳定的版本，适合第一次驾驶本车的车手，或希望获得比高下压力设置更高稳定性的车手。
      
      #### 高下压力
      
      适用于大多数赛道。该设置效率相当高并能产生最大下压力，但同时也会产生最大阻力。
      
      #### 中下压力
      
      适用于 Spa 等拥有长直道的赛道。牺牲更多下压力和效率，以换取更高的直线速度。
      
      #### 低下压力
      
      适用于勒芒。最低阻力和下压力配置。
      
      #### Daytona
      
      低下压力设置的变体，适用于 Daytona，并进行了改动以避免在椭圆赛道倾斜弯道上触底。
      
      #### Daytona 24H
      
      Daytona 设置的变体，专门考虑了一年中的时间、预期天气以及 24 小时比赛设置的要求。
      
      除固定 IMSA 设置外，所有设置的燃油量均设为 89 L，这是本车油箱的最大容量。
      
      #### 固定设置
      
      为官方 IMSA 固定赛制提供的高下压力设置，燃油量受限。
      
      #### 固定排位设置
      
      带有排位赛燃油量和混合动力释放的固定赛制设置。
      
      #### 固定 Le Mans 设置
      
      为官方 IMSA 固定赛制提供的低下压力设置，燃油量受限。
      
      #### 固定 Le Mans 排位设置
      
      带有排位赛燃油量和混合动力释放的固定低下压力赛制设置。
      
      #### 固定 Daytona 设置
      
      为官方 IMSA 固定赛制提供的 Daytona 设置，燃油量受限。
      
      #### 固定 Daytona 排位设置
      
      带有排位赛燃油量和混合动力释放的 Daytona 赛制设置。
      
      | 底盘高度 | 数值 |
      | --- | --- |
      | BMW M Hybrid V8 LMDh 在平均后车高为 50 mm、平均前车高尽可能低时产生最大下压力，且通常效率最高。需要注意的是，在不触底的前提下，车身前后两端都尽可能低时阻力最小。 | 通常应尽可能使用较软的前升沉弹簧，使车头在不过度触底、且制动或入弯时不产生不良空气动力平衡偏移的前提下尽量降低。 |
      | 更大的俯仰角（后部车高高于前部车高）会使空气动力学平衡向前移动（转向过度），更小的俯仰角会使其向后移动（转向不足）。 | 较软的后部第三弹簧会让车辆后部在空气动力学负荷下下沉，但由于后车高会明显低于最佳效率所需的目标车高（50 mm），车辆会在弯中损失部分下压力和效率。因此需要在阻力／下压力和动态空气动力学平衡之间作出妥协。 |
      
      在不改变侧倾刚度的情况下，可以通过调整前部 Heave 弹簧和后部第三弹簧的刚度来影响赛道上的动态车高。
      
      | 空气动力学调整 | 数值 |
      | --- | --- |
      | 如果要调整设置，改变空气动力学平衡最容易的方法是调整后翼角度。一般来说，如果发现需要将翼面位置向任一方向调整超过一格，建议从其他下压力配置（高、中或低）之一开始。 | 如果希望在不改变下压力 / 阻力配置的情况下改变空气动力学平衡，可以增大或减小后部推杆长度偏移来调整后部车高。由于下压力很大，这会影响所有情况下的平衡，但在中高速弯中尤其明显。 |
      | 降低翼角 = 更多转向过度、更少下压力和更高直线速度。 | 后推杆长度差值更低 = 更低后车高、更小俯仰角，以及更靠后的空气动力学平衡（转向不足）。 |
      | 提高翼角 = 更多转向不足、更多下压力和更低直线速度。 | 后推杆长度差值更高 = 更高后车高、更大俯仰角，以及更靠前的空气动力学平衡（转向过度）。 |

    bodyEn: |+
      There are 12 iRacing setups provided for the BMW M Hybrid V8 LMDh:
      
      #### BASELINE
      
      A slightly more stable version of the high downforce setup for a driver’s first time in the car or for those wanting more stability than the high downforce setup provides.
      
      #### HIGH DOWNFORCE
      
      For use at most tracks. Although quite efficient and creating the most downforce, this setup also makes the most drag.
      
      #### MEDIUM DOWNFORCE
      
      For use at track with long straights like Spa. Sacrificing more downforce and efficiency for more straight line speed.
      
      #### LOW DOWNFORCE
      
      For use at Le Mans. Lowest drag and downforce trim.
      
      #### DAYTONA
      
      A variation of the Low Downforce setup for use at Daytona with changes to avoid bottoming on the oval banking.
      
      #### DAYTONA 24H
      
      A variation on the Daytona setup made specifically with time of year, expected weather, and the demands of a 24 hour race setup in mind.
      
      The fuel level in all setups (except the fixed IMSA setups) are set to 89 L, which is the maximum tank capacity for this car.
      
      #### FIXED
      
      The high downforce setup with limited fuel for the official IMSA fixed series.
      
      #### FIXED QUAL
      
      The fixed series setup with qualifying fuel and hybrid deployment.
      
      #### FIXED LEMANS
      
      The low downforce setup with limited fuel for the official IMSA fixed series.
      
      #### FIXED LEMANS QUAL
      
      The fixed LDF series setup with qualifying fuel and hybrid deployment.
      
      #### FIXED DAYTONA
      
      The Daytona setup with limited fuel for the official IMSA fixed series.
      
      #### FIXED DAYTONA QUAL
      
      The Daytona series setup with qualifying fuel and hybrid deployment.
      
      | CHASSIS HEIGHTS | Value |
      | --- | --- |
      | The BMW M Hybrid V8 LMDh generates the most downforce (and is generally the most efficient) with an average rear ride height of 50mm and an average front ride height as low as possible. It’s important to note that the least amount of drag is generated when both ends of the car are as low as possible (without bottoming). | In general the front heave spring should be as soft as possible to allow the nose of the car to be as low as possible without excessive bottoming or an undesirable aero balance shift under braking/turn in. |
      | More rake (high rear ride heights compared to front ride heights) will move aero balance forward (oversteer) and less rake will move it rearwards (understeer). | A soft rear third spring will allow the rear of the car to drop under aero load reducing drag but you will lose some amount of downforce and efficiency mid corner as the rear ride heights will be well under the target rear heights for maximum efficiency (50mm). Some compromises will need to be made regarding drag/downforce and dynamic aero balance. |
      
      You can affect the dynamic ride heights (without changing the roll stiffness) on track by adjusting the front heave spring and the rear third spring stiffnesses.
      
      | AERODYNAMIC ADJUSTMENTS | Value |
      | --- | --- |
      | Should you choose to make adjustments to the setup, the easiest way to change the aerodynamic balance of the setup is through adjustment of the rear wing angle. Generally speaking, if you find you want to adjust wing position in more than a click in either direction it is recommended you start from one of the other downforce trim setups (high, medium, or low). | If you would like to change the aero balance without changing the downforce/drag trim adjust the rear ride height by increasing or decreasing the rear pushrod length offset. This will affect balance in all situations due to the high amount of downforce but this will be particularly noticeable in mid and high speed corners. |
      | Lower wing angle = More oversteer, less downforce, and higher straight line speed. | Lower pushrod length delta = Lower rear ride height, less rake, and a more rearward aero balance (understeer). |
      | Higher wing angle = More understeer, more downforce, and lower straight line speed. | Higher pushrod length delta = Higher rear ride height, more rake, and a more forward aero balance (oversteer). |

  - id: mechanical-adjustments
    level: 3
    titleZh: 机械调整
    titleEn: MECHANICAL ADJUSTMENTS
    bodyZh: |+
      如果希望在不改变空气动力学平衡的情况下改变机械平衡，可以调整前、后防倾杆及其叶片。这在您对车辆总体平衡满意、但希望在低速弯中获得更多或更少旋转时尤其有用。
      
      前防倾杆更大 / 叶片数值更高 = 更多转向不足
      
      前防倾杆更小 / 叶片数值更低 = 更少转向不足
      
      后防倾杆更大 / 叶片数值更高 = 更多转向过度
      
      后防倾杆更小 / 叶片数值更低 = 更少转向过度

    bodyEn: |+
      If you would like to change the mechanical balance without changing the aero balance the front and rear ARBs and ARB blades may be adjusted. This can be particularly useful if you are happy with the general balance of the car but want either more or less rotation in slow speed corners.
      
      Bigger front ARB/higher blade value = More understeer
      
      Smaller front ARB/lower blade values = Less understeer
      
      Bigger rear ARB/higher blade values = More oversteer
      
      Smaller rear ARB/lower blade values = Less oversteer

  - id: differential-adjustments
    level: 3
    titleZh: 差速器调整
    titleEn: DIFFERENTIAL ADJUSTMENTS
    bodyZh: |+
      后差速器是 Cadillac 中一个强大的工具，最简单的调整方法是增加或减少预载。调整预载会影响油门开启时的表现，但您可能会更明显地感受到它对入弯和初始转向的影响。
      
      - 更多预载 = 松油门时旋转更少，入弯时稳定性更高。
      - 更少预载 = 松油门时旋转更多，入弯时稳定性更低。
      - 更多预载 = 松油门时旋转更少，入弯时稳定性更高。
      - 更少预载 = 松油门时旋转更多，入弯时稳定性更低。

    bodyEn: |+
      The rear differential is a powerful tool in the BMW M Hybrid V8 LMDh, and the simplest change one can make is increasing or decreasing the preload. While adjusting the preload will affect the on throttle behavior you will probably notice more of a change on entry and turn in.
      
      - More preload = Less rotation off throttle, more stability on entry.
      - Less preload = More rotation off throttle, less stability on entry.
