  - id: aero-settings
    level: 3
    titleZh: 空气动力学设置
    titleEn: AERO SETTINGS
    bodyZh: |+
      ![图示](./assets/bmw-m-hybrid-v8/aero-settings.png)
      
      #### 前/后高速车高（FRONT/REAR RH AT SPEED）
      
      | 后翼角度（REAR WING ANGLE） | 数值 |
      | --- | --- |
      | 后翼角度设置会改变后翼的迎角。增大角度会增加产生的下压力并使空气动力学平衡后移，但也会增加尾翼产生的阻力。减小角度会降低总下压力并使空气动力学平衡前移，同时降低阻力并允许更高的最高速度。此角度是参考测量值，并非相对于地面的绝对角度。 | 高速车高（RH at Speed）用于向空气动力学计算器提供计算参考高度。使用空气动力学计算器时，应通过遥测在赛道任意位置确定车辆的前、后车高，并将该数值输入“Front RH at Speed”设置。 |
      | 空气动力学计算器用于显示特定配置下车辆近似的空气动力学数值。改变车辆空气动力学设置后，计算器中的数值也会更新，从而帮助判断车辆在赛道上的空气动力学表现。该计算器还可用于确定需要对车辆进行哪些改动，以缓解空气动力学导致的操控问题。 | 该数值以车头下压力的百分比显示，表示车辆总下压力中位于前轴上方的比例。百分比越高，说明前部下压力越大，中高速弯中的转向过度越明显；百分比越低，说明后部下压力越大，中高速弯中的转向不足越明显。 |
      
      #### 下压力平衡（DOWNFORCE BALANCE）
      
      #### 空气动力学计算器（AERO CALCULATOR）
      
      #### 升阻比（L/D）
      
      “L/D”数值是升力（下压力）与阻力的比值，用于量化车身产生下压力时所带来的阻力。L/D 越高，表示每单位阻力产生的下压力越多，也就是车身效率越高。在不牺牲总下压力的情况下，提高 L/D 会带来更快、更高效的车辆。L/D 的最佳值会因空气动力学配置和赛道类型而异。

    bodyEn: |+
      ![Image](./assets/bmw-m-hybrid-v8/aero-settings.png)
      
      #### FRONT/REAR RH AT SPEED
      
      | REAR WING ANGLE | Value |
      | --- | --- |
      | The Rear Wing Angle setting changes the angle of attack of the rear wing. Increasing the angle will increase the amount of downforce produced and move the aero balance rearward but will increase the amount of drag the wing produces. Reducing the angle will reduce overall downforce and shift aero balance forward, but will reduce drag and allow for a higher top speed. This angle is expressed as a reference measurement, not an absolute angle relative to the ground. | The Ride Height (RH) at Speed is used to give the Aero Calculator heights to reference for aerodynamic calculations. When using the aero calculator, determine the car’s Front and Rear Ride height via telemetry at any point on track and input that value into the “Front RH at Speed” setting. |
      | The Aero Calculator is a tool used to display the car’s approximate aerodynamic values in a given configuration. Changes to the car’s aerodynamic settings will be reflected in the Aero Calculator, giving an idea of how the car will behave aerodynamically while on the race track. This calculator can also be used to determine what changes need to be made to the car to alleviate aerodynamically-induced handling issues. | Displayed in percent of Front downforce, this value shows how much of the car’s total downforce is over the front axle. A higher percentage value indicates more front downforce, increasing oversteer in mid- to high-speed corners and a lower percentage value indicates more rear downforce, increasing understeer in mid- to high-speed corners. |
      
      #### DOWNFORCE BALANCE
      
      #### AERO CALCULATOR
      
      #### L/D
      
      The “L/D” value is the ratio of Lift (downforce) to Drag. This quantifies how efficiently the car’s bodywork is producing downforce in terms of how much drag is being produced as a result. A higher L/D value means more downforce is being produced for each unit of drag, meaning the bodywork is being more efficient. Having a higher L/D value without sacrificing overall downforce will result in a faster, more efficient car. Optimum values for L/D can vary based on the aerodynamic configuration and track type.

